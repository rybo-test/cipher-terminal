<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>C.I.P.H.E.R. // Regional Cartography</title>
  <link rel="stylesheet" href="css/cipher-style.css">
  <style>
    .map-stage {
      flex: 1;
      position: relative;
      background-color: var(--bg-primary);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .map-controls-strip {
      padding: 8px 12px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      z-index: 5;
    }

    .sector-select-dropdown {
      background-color: var(--bg-surface-raised);
      color: var(--text-bright);
      border: 1px solid var(--border-bright);
      font-family: var(--font-ui);
      font-size: var(--font-size-sm);
      padding: 6px 10px;
      font-weight: bold;
    }

    .svg-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    #map-svg-canvas {
      width: 100%;
      height: 100%;
    }

    /* Vector Geometry Tokens */
    .map-vector-hwy {
      stroke: var(--text-bright);
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .map-vector-road {
      stroke: var(--border-bright);
      stroke-width: 2;
      stroke-dasharray: 5, 4;
      fill: none;
    }

    .map-vector-water {
      stroke: #38bdf8;
      stroke-width: 3;
      fill: none;
      opacity: 0.85;
    }

    .map-vector-topo {
      stroke: var(--text-dim);
      stroke-width: 1.2;
      fill: none;
      opacity: 0.6;
    }

    .map-vector-topo-subtle {
      stroke: var(--border-color);
      stroke-width: 1;
      stroke-dasharray: 2, 4;
      fill: none;
    }

    .map-town-dot {
      fill: #ffffff;
    }

    .map-town-label {
      fill: #ffffff;
      font-family: var(--font-ui);
      font-size: var(--map-town-size, 14px);
      letter-spacing: 0.5px;
      font-weight: bold;
    }

    /* Interactive Location Pins */
    .map-location-pin {
      cursor: pointer;
    }

    .pin-ring {
      fill: var(--bg-surface);
      stroke: var(--border-bright);
      stroke-width: 2;
    }

    .pin-core {
      fill: var(--text-bright);
    }

    .pin-label {
      fill: var(--text-bright);
      font-family: var(--font-mono);
      font-size: var(--map-pin-size, 13px);
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .pin-pulse {
      fill: none;
      stroke: var(--text-bright);
      stroke-width: 1.5;
      opacity: 0.8;
      animation: pulse-ring 2s infinite ease-out;
    }

    .pin-secret .pin-ring {
      stroke: var(--accent-amber);
    }

    .pin-secret .pin-core {
      fill: var(--accent-amber);
    }

    .pin-secret .pin-label {
      fill: var(--accent-amber);
    }

    @keyframes pulse-ring {
      0% { r: 8; opacity: 1; }
      100% { r: 20; opacity: 0; }
    }

    /* Fog of War Shroud */
    .shroud-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        -45deg,
        rgba(5, 10, 6, 0.95),
        rgba(5, 10, 6, 0.95) 10px,
        rgba(17, 32, 21, 0.95) 10px,
        rgba(17, 32, 21, 0.95) 20px
      );
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      z-index: 4;
    }

    .shroud-card {
      background-color: var(--bg-surface);
      border: 1px dashed var(--accent-alert);
      padding: 18px;
      max-width: 320px;
    }

    .shroud-alert {
      color: var(--accent-alert);
      font-weight: bold;
      font-size: var(--font-size-md);
      margin-bottom: 8px;
    }

    .shroud-title {
      color: var(--text-bright);
      font-size: var(--font-size-sm);
      margin-bottom: 6px;
    }

    .shroud-desc {
      color: var(--text-dim);
      font-size: var(--font-size-sm);
    }

    /* POI Slide-Up Drawer */
    .poi-drawer {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      background-color: var(--bg-surface-raised);
      border-top: 2px solid var(--border-bright);
      padding: 14px;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
      z-index: 6;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .poi-drawer.open {
      transform: translateY(0);
    }

    .poi-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .poi-title {
      font-size: var(--font-size-lg);
      font-weight: bold;
      color: #ffffff;
      font-family: var(--font-ui);
    }

    .poi-meta {
      font-size: var(--font-size-sm);
      color: var(--text-dim);
    }

    .poi-details-box {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      padding: 10px;
      font-size: var(--font-size-base);
      line-height: 1.4;
    }

    .poi-action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    /* Travel Modal */
    .travel-modal-backdrop {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 10, 6, 0.85);
      z-index: 8;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .travel-modal-card {
      background-color: var(--bg-surface-raised);
      border: 1px solid var(--border-bright);
      width: 100%;
      max-width: 380px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .travel-options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .travel-option-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      padding: 12px;
      justify-content: flex-start;
    }

    .travel-icon {
      font-size: 1.5rem;
    }

    .travel-meta {
      display: flex;
      flex-direction: column;
    }

    .travel-title {
      font-size: var(--font-size-md);
      color: #ffffff;
    }

    .travel-desc {
      font-size: var(--font-size-sm);
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Single-Line Status Header -->
    <header class="status-header">
      <span class="brand-title">C.I.P.H.E.R. // MAP v3.4</span>
      <span class="telemetry-pill">12.6V FLOAT: OK</span>
    </header>

    <main class="map-stage">
      <!-- Sector & Theme Controls -->
      <div class="map-controls-strip">
        <select id="sector-select" class="sector-select-dropdown">
          <option value="SECTOR_01">SECTOR 01: CACHE VALLEY</option>
          <option value="SECTOR_02">SECTOR 02: BOX ELDER</option>
          <option value="SECTOR_03">SECTOR 03: BEAR LAKE</option>
          <option value="SECTOR_04">SECTOR 04: SE IDAHO</option>
        </select>
        <button id="btn-theme-toggle" class="btn-cipher" style="padding: 6px 10px; font-size: var(--font-size-sm);">[ CRT VECTOR ]</button>
      </div>

      <!-- Vector Canvas Area -->
      <div class="svg-container">
        <svg id="map-svg-canvas" viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet"></svg>
        
        <!-- Fog of War Shroud -->
        <div id="map-shroud-overlay" class="shroud-overlay"></div>

        <!-- POI Slide-Up Drawer -->
        <div id="poi-drawer" class="poi-drawer">
          <div class="poi-header-row">
            <div>
              <div id="poi-name" class="poi-title">Location Name</div>
              <div id="poi-type" class="poi-meta">Container // Difficulty</div>
            </div>
            <button id="btn-close-drawer" class="btn-cipher" style="padding: 4px 8px; font-size: var(--font-size-sm);">✕</button>
          </div>
          <div class="poi-details-box">
            <div><strong>COORDS:</strong> <span id="poi-coords" style="color: var(--accent-amber); font-weight: bold;">N 00° 00.000 W 000° 00.000</span></div>
            <div style="margin-top: 4px;"><strong>TERRAIN:</strong> <span id="poi-terrain" style="color: #d1fae5;">Terrain description</span></div>
          </div>
          <div class="poi-action-grid">
            <button class="btn-cipher primary" onclick="window.location.href='mission.html'">
              <svg class="ui-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              <span>CRACK</span>
            </button>
            <button class="btn-cipher" onclick="CipherMap.openTravelModal()">
              <svg class="ui-icon" viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
              <span>TRAVEL</span>
            </button>
          </div>
        </div>

        <!-- Travel Mode Selector Modal -->
        <div id="travel-modal" class="travel-modal-backdrop">
          <div class="travel-modal-card">
            <div class="panel-header">SELECT TRAVEL MODE</div>
            <div id="travel-options-list" class="travel-options-list"></div>
            <button class="btn-cipher" onclick="CipherMap.closeTravelModal()">[ CANCEL ]</button>
          </div>
        </div>
      </div>

      <!-- Docked CB Radio Scanner Bar -->
      <div class="rat-comms-dock">
        <div class="rat-comms-channel">CH 19</div>
        <div class="s-meter-block">
          <span>SIG:</span>
          <div class="s-meter-bar">
            <div class="s-meter-seg"></div>
            <div class="s-meter-seg"></div>
            <div class="s-meter-seg"></div>
            <div class="s-meter-seg"></div>
            <div class="s-meter-seg"></div>
          </div>
        </div>
        <div id="comms-ticker" class="rat-comms-ticker">[SCANNING RAT CH 19...]</div>
      </div>
    </main>

    <!-- Symmetrical 4-Anchor Nav with Dedicated SVG Icons -->
    <nav class="nav-anchor-strip">
      <a href="mission.html" class="nav-tab">
        <svg class="ui-icon ui-icon-nav" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <span>MISSION</span>
      </a>
      <a href="map.html" class="nav-tab active">
        <svg class="ui-icon ui-icon-nav" viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
        <span>MAP</span>
      </a>
      <a href="pack.html" class="nav-tab">
        <svg class="ui-icon ui-icon-nav" viewBox="0 0 24 24"><path d="M4 10a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10z"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path></svg>
        <span>PACK</span>
      </a>
      <a href="profile.html" class="nav-tab">
        <svg class="ui-icon ui-icon-nav" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>MENU</span>
      </a>
    </nav>
  </div>

  <script src="js/cipher-audio.js"></script>
  <script src="js/cipher-core.js"></script>
  <script src="js/cipher-map.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      CipherMap.init();
      const state = CipherCore.getState();
      const themeToggle = document.getElementById('btn-theme-toggle');
      if (themeToggle) {
        themeToggle.textContent = (state.meta.theme || 'crt') === 'crt' ? '[ CRT VECTOR ]' : '[ TOPO BLUEPRINT ]';
      }
    });
  </script>
</body>
</html>
