<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C.I.P.H.E.R. // Trail Cartography</title>
  <link rel="stylesheet" href="css/cipher-style.css?v=3.70">
  <style>
    .map-stage {
      flex: 1;
      position: relative;
      background-color: var(--bg-primary);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .map-controls-strip {
      padding: 8px 12px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      z-index: 5;
      flex-shrink: 0;
    }
    .sector-select-dropdown {
      background-color: #06110a;
      color: var(--text-bright);
      border: 1.5px solid var(--border-bright);
      font-family: var(--font-ui);
      font-size: var(--font-sm);
      min-height: 44px;
      padding: 0 12px;
      border-radius: 6px;
      font-weight: bold;
      flex: 1;
    }
    .svg-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }
    #map-svg-canvas { width: 100%; height: 100%; }

    .map-vector-hwy { stroke: var(--text-bright); stroke-width: 4.5; fill: none; stroke-linecap: round; }
    .map-vector-road { stroke: var(--border-bright); stroke-width: 2.5; stroke-dasharray: 6, 4; fill: none; }
    .map-vector-water { stroke: #38bdf8; stroke-width: 3.5; fill: none; opacity: 0.85; }
    .map-vector-topo { stroke: var(--text-dim); stroke-width: 1.5; fill: none; opacity: 0.6; }
    .map-vector-topo-subtle { stroke: var(--border-color); stroke-width: 1; stroke-dasharray: 3, 4; fill: none; }
    .map-town-label { fill: #ffffff; font-family: var(--font-ui); font-size: 14px; font-weight: bold; }
    .map-location-pin { cursor: pointer; outline: none; }
    .pin-ring { fill: var(--bg-surface); stroke: var(--border-bright); stroke-width: 2.5; }
    .pin-core { fill: var(--text-bright); }
    .pin-label { fill: var(--text-bright); font-family: var(--font-mono); font-size: 13px; font-weight: bold; }

    /* Fog of War Shroud & Message Box */
    .shroud-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        -45deg,
        rgba(5, 10, 6, 0.95),
        rgba(5, 10, 6, 0.95) 12px,
        rgba(15, 30, 20, 0.95) 12px,
        rgba(15, 30, 20, 0.95) 24px
      );
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      z-index: 10;
    }
    .shroud-card {
      background-color: var(--bg-surface);
      border: 2px dashed var(--accent-alert);
      border-radius: 8px;
      padding: 22px;
      max-width: 340px;
    }
    .shroud-alert { color: var(--accent-alert); font-weight: bold; font-size: var(--font-md); margin-bottom: 8px; font-family: var(--font-mono); }
    .shroud-title { color: #ffffff; font-size: var(--font-lg); font-weight: bold; margin-bottom: 8px; }
    .shroud-desc { color: var(--text-dim); font-size: var(--font-sm); line-height: 1.4; }

    /* Elevated POI Drawer */
    .poi-drawer {
      position: absolute;
      left: 10px; right: 10px; bottom: 70px;
      background-color: var(--bg-surface);
      border: 2px solid var(--border-bright);
      border-radius: 8px;
      padding: 14px;
      z-index: 25;
      display: none;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.85);
    }
    .poi-drawer.open { display: flex; }
    .poi-header-row { display: flex; justify-content: space-between; align-items: center; }
    .poi-title { font-size: var(--font-lg); font-weight: bold; color: #ffffff; }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="status-header">
      <span class="brand-title">C.I.P.H.E.R. // v3.7-TRAIL</span>
      <div class="header-status-pill" role="status">
        <span class="dot"></span>
        <span>ONLINE // GZ</span>
      </div>
      <span class="header-user-tag">NEZZMUK 👤</span>
    </header>

    <main class="map-stage">
      <section class="map-controls-strip">
        <label for="sector-select" class="sr-only">Sector</label>
        <select id="sector-select" class="sector-select-dropdown">
          <option value="SECTOR_01">SECTOR 01: CACHE VALLEY</option>
          <option value="SECTOR_02">SECTOR 02: BOX ELDER</option>
          <option value="SECTOR_03">SECTOR 03: BEAR LAKE</option>
          <option value="SECTOR_04">SECTOR 04: SE IDAHO</option>
        </select>
        <button id="btn-theme-toggle" class="btn-cipher" style="padding: 0 14px; font-size: var(--font-sm);">[ CRT ]</button>
      </section>

      <section class="svg-container">
        <svg id="map-svg-canvas" viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet"></svg>
        
        <!-- Fog of War Overlay -->
        <div id="map-shroud-overlay" class="shroud-overlay"></div>

        <!-- POI Drawer -->
        <section id="poi-drawer" class="poi-drawer">
          <div class="poi-header-row">
            <div>
              <h2 id="poi-name" class="poi-title">Location Name</h2>
              <div id="poi-type" style="font-size: var(--font-sm); color: var(--text-dim);">Container // Difficulty</div>
            </div>
            <button id="btn-close-drawer" class="btn-cipher" style="min-height: 38px; padding: 0 10px;">✕</button>
          </div>
          <div style="background-color: #06110a; border: 1px solid var(--border-color); padding: 10px; border-radius: 4px; font-size: var(--font-base);">
            <div><strong>COORDS:</strong> <span id="poi-coords" style="color: var(--accent-amber); font-weight: bold;">N 00° 00.000 W 000° 00.000</span></div>
            <div style="margin-top: 4px;"><strong>TERRAIN:</strong> <span id="poi-terrain" style="color: var(--text-dim);">Terrain description</span></div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn-cipher primary-solid" onclick="window.location.href='mission.html'">CRACK</button>
            <button class="btn-cipher" onclick="CipherMap.openTravelModal()">TRAVEL</button>
          </div>
        </section>

        <!-- Travel Modal -->
        <section id="travel-modal" style="position: absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); z-index:30; display:none; align-items:center; justify-content:center; padding:16px;">
          <div style="background-color: var(--bg-surface); border:2px solid var(--border-bright); border-radius:8px; width:100%; max-width:380px; padding:16px; display:flex; flex-direction:column; gap:12px;">
            <div class="section-category-tag">SELECT TRANSIT MODE</div>
            <div id="travel-options-list" style="display:flex; flex-direction:column; gap:8px;"></div>
            <button class="btn-cipher" onclick="CipherMap.closeTravelModal()">[ CANCEL ]</button>
          </div>
        </section>
      </section>

      <!-- CB Radio Scanner Dock -->
      <aside class="rat-comms-dock">
        <span class="rat-comms-channel">CH 19</span>
        <div class="s-meter-block" aria-hidden="true">
          <div class="s-meter-bar">
            <div class="s-meter-seg lit"></div>
            <div class="s-meter-seg lit"></div>
            <div class="s-meter-seg lit"></div>
            <div class="s-meter-seg"></div>
          </div>
        </div>
        <div id="comms-ticker" class="rat-comms-ticker">[SCANNING RAT CH 19...]</div>
      </aside>
    </main>

    <!-- Navigation Strip -->
    <nav class="nav-anchor-strip">
      <a href="mission.html" class="nav-tab">
        <svg class="ui-icon-nav" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <span>MISSION</span>
      </a>
      <a href="map.html" class="nav-tab active">
        <svg class="ui-icon-nav" viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
        <span>TRAIL</span>
      </a>
      <a href="pack.html" class="nav-tab">
        <svg class="ui-icon-nav" viewBox="0 0 24 24"><path d="M4 10a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10z"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path></svg>
        <span>PACK</span>
      </a>
      <a href="profile.html" class="nav-tab">
        <svg class="ui-icon-nav" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>MENU</span>
      </a>
    </nav>
  </div>

  <script src="js/cipher-audio.js"></script>
  <script src="js/cipher-core.js"></script>
  <script src="js/cipher-map.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof CipherMap !== 'undefined') CipherMap.init();
    });
  </script>
</body>
</html>
