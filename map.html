<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C.I.P.H.E.R. // Regional Cartography</title>
  <link rel="stylesheet" href="css/cipher-style.css?v=3.50">
  <style>
    /* Direct Fail-Safe Inlined Styles */
    :root {
      --bg-primary: #050a06;
      --bg-surface: #0a140d;
      --bg-surface-raised: #112015;
      --border-color: #1b3822;
      --border-bright: #00e676;
      --text-main: #ffffff;
      --text-bright: #00e676;
      --text-dim: #a7f3d0;
      --accent-amber: #ffb300;
      --accent-alert: #ff5252;
      --font-mono: 'Courier New', Courier, monospace;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100dvh;
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 15px;
      line-height: 1.45;
      overflow: hidden;
      touch-action: manipulation;
    }
    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 600px;
      height: 100dvh;
      margin: 0 auto;
      background-color: var(--bg-primary);
      position: relative;
    }
    .status-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-surface);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .status-header h1.brand-title {
      color: var(--text-bright);
      font-family: var(--font-ui);
      font-size: 14px;
      letter-spacing: 0.5px;
      margin: 0;
    }
    .status-header .telemetry-pill {
      color: var(--text-dim);
      font-size: 12px;
    }
    .map-stage {
      flex: 1;
      position: relative;
      background-color: var(--bg-primary);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .map-controls-strip {
      padding: 8px 12px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 5;
      flex-shrink: 0;
    }
    .sector-select-dropdown {
      background-color: var(--bg-surface-raised);
      color: var(--text-bright);
      border: 1px solid var(--border-bright);
      font-family: var(--font-ui);
      font-size: 13px;
      min-height: 44px;
      padding: 0 12px;
      font-weight: bold;
      flex: 1;
    }
    .svg-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }
    #map-svg-canvas {
      width: 100%;
      height: 100%;
    }
    .map-vector-hwy {
      stroke: var(--text-bright);
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .map-vector-road {
      stroke: var(--border-bright);
      stroke-width: 2;
      stroke-dasharray: 5, 4;
      fill: none;
    }
    .map-vector-water {
      stroke: #38bdf8;
      stroke-width: 3;
      fill: none;
      opacity: 0.85;
    }
    .map-vector-topo {
      stroke: var(--text-dim);
      stroke-width: 1.2;
      fill: none;
      opacity: 0.6;
    }
    .map-vector-topo-subtle {
      stroke: var(--border-color);
      stroke-width: 1;
      stroke-dasharray: 2, 4;
      fill: none;
    }
    .map-town-dot { fill: #ffffff; }
    .map-town-label {
      fill: #ffffff;
      font-family: var(--font-ui);
      font-size: 14px;
      letter-spacing: 0.5px;
      font-weight: bold;
    }
    .map-location-pin { cursor: pointer; outline: none; }
    .map-location-pin:focus .pin-ring { stroke: #ffffff; stroke-width: 3; }
    .pin-ring { fill: var(--bg-surface); stroke: var(--border-bright); stroke-width: 2; }
    .pin-core { fill: var(--text-bright); }
    .pin-label { fill: var(--text-bright); font-family: var(--font-mono); font-size: 13px; font-weight: bold; }
    .pin-pulse {
      fill: none;
      stroke: var(--text-bright);
      stroke-width: 1.5;
      opacity: 0.8;
      animation: pulse-ring 2s infinite ease-out;
    }
    .pin-secret .pin-ring, .pin-secret .pin-core, .pin-secret .pin-label {
      stroke: var(--accent-amber);
      fill: var(--accent-amber);
    }
    @keyframes pulse-ring { 0% { r: 8; opacity: 1; } 100% { r: 20; opacity: 0; } }
    .shroud-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        -45deg,
        rgba(5, 10, 6, 0.95),
        rgba(5, 10, 6, 0.95) 10px,
        rgba(17, 32, 21, 0.95) 10px,
        rgba(17, 32, 21, 0.95) 20px
      );
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      z-index: 4;
    }
    .shroud-card {
      background-color: var(--bg-surface);
      border: 1px dashed var(--accent-alert);
      padding: 18px;
      max-width: 320px;
    }
    .shroud-alert { color: var(--accent-alert); font-weight: bold; font-size: 16px; margin-bottom: 8px; }
    .shroud-title { color: var(--text-bright); font-size: 13px; margin-bottom: 6px; }
    .shroud-desc { color: var(--text-dim); font-size: 13px; }
    .poi-drawer {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      background-color: var(--bg-surface-raised);
      border-top: 2px solid var(--border-bright);
      padding: 12px 14px 16px;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
      z-index: 6;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .poi-drawer.open { transform: translateY(0); }
    .drawer-drag-handle {
      width: 36px;
      height: 4px;
      background-color: var(--border-bright);
      margin: 0 auto 6px;
      border-radius: 2px;
      opacity: 0.6;
    }
    .poi-header-row { display: flex; justify-content: space-between; align-items: center; }
    .poi-title { font-size: 19px; font-weight: bold; color: #ffffff; font-family: var(--font-ui); margin: 0; }
    .poi-meta { font-size: 13px; color: var(--text-dim); }
    .poi-details-box {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      padding: 10px;
      font-size: 15px;
      line-height: 1.4;
    }
    .poi-action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
    .travel-modal-backdrop {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 10, 6, 0.85);
      z-index: 8;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .travel-modal-card {
      background-color: var(--bg-surface-raised);
      border: 1px solid var(--border-bright);
      width: 100%;
      max-width: 380px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .travel-options-list { display: flex; flex-direction: column; gap: 10px; }
    .travel-option-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      padding: 12px;
      justify-content: flex-start;
      min-height: 48px;
    }
    .travel-icon { font-size: 1.5rem; }
    .travel-meta { display: flex; flex-direction: column; }
    .travel-title { font-size: 16px; color: #ffffff; }
    .travel-desc { font-size: 13px; color: var(--text-dim); }
    .btn-cipher {
      background-color: var(--bg-surface-raised);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      min-height: 44px;
      padding: 10px 16px;
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      touch-action: manipulation;
    }
    .btn-cipher.primary { border-color: var(--border-bright); color: var(--text-bright); }
    .ui-icon {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }
    .ui-icon-nav { width: 22px; height: 22px; margin-bottom: 2px; }
    .rat-comms-dock {
      background-color: var(--bg-surface-raised);
      border-top: 1px solid var(--border-bright);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      flex-shrink: 0;
    }
    .rat-comms-channel {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      padding: 3px 6px;
      color: var(--accent-amber);
      font-weight: bold;
      font-size: 12px;
      flex-shrink: 0;
    }
    .s-meter-block { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
    .s-meter-bar { display: flex; gap: 2px; }
    .s-meter-seg { width: 4px; height: 12px; background-color: var(--border-color); }
    .s-meter-seg.lit { background-color: var(--text-bright); }
    .s-meter-seg.peak { background-color: var(--accent-alert); }
    .rat-comms-ticker {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: #ffffff;
      font-weight: bold;
    }
    .nav-anchor-strip {
      display: flex;
      width: 100%;
      height: calc(56px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      border-top: 1px solid var(--border-color);
      background-color: var(--bg-surface);
      z-index: 10;
      flex-shrink: 0;
    }
    .nav-tab {
      flex: 1 1 25%;
      width: 25%;
      min-height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      border-right: 1px solid var(--border-color);
      color: var(--text-dim);
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      text-decoration: none;
      touch-action: manipulation;
    }
    .nav-tab:last-child { border-right: none; }
    .nav-tab.active {
      color: var(--text-bright);
      background-color: var(--bg-surface-raised);
      border-top: 3px solid var(--border-bright);
    }
    .nav-tab.active .ui-icon { stroke: var(--text-bright); }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="status-header">
      <h1 class="brand-title">C.I.P.H.E.R. // MAP v3.4</h1>
      <div class="telemetry-pill" role="status" aria-label="System Voltage">12.6V FLOAT: OK</div>
    </header>

    <main class="map-stage">
      <section class="map-controls-strip" aria-label="Map Navigation Controls">
        <label for="sector-select" class="sr-only">Choose Geographic Sector</label>
        <select id="sector-select" class="sector-select-dropdown">
          <option value="SECTOR_01">SECTOR 01: CACHE VALLEY</option>
          <option value="SECTOR_02">SECTOR 02: BOX ELDER</option>
          <option value="SECTOR_03">SECTOR 03: BEAR LAKE</option>
          <option value="SECTOR_04">SECTOR 04: SE IDAHO</option>
        </select>
        <button id="btn-theme-toggle" class="btn-cipher" style="min-height: 44px; padding: 0 14px; font-size: 13px;">[ CRT VECTOR ]</button>
      </section>

      <section class="svg-container" aria-label="Vector Cartography Canvas">
        <svg id="map-svg-canvas" viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet" role="region" aria-label="Interactive Regional Map"></svg>
        
        <div id="map-shroud-overlay" class="shroud-overlay"></div>

        <section id="poi-drawer" class="poi-drawer" role="dialog" aria-modal="false" aria-labelledby="poi-name">
          <div class="drawer-drag-handle" aria-hidden="true"></div>
          <div class="poi-header-row">
            <div>
              <h2 id="poi-name" class="poi-title">Location Name</h2>
              <div id="poi-type" class="poi-meta">Container // Difficulty</div>
            </div>
            <button 
              id="btn-close-drawer" 
              class="btn-cipher" 
              aria-label="Close Point of Interest Details" 
              style="width: 44px; height: 44px; min-width: 44px; min-height: 44px; padding: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 18px;"
            >
              <span aria-hidden="true">✕</span>
            </button>
          </div>
          <div class="poi-details-box">
            <div><strong>COORDS:</strong> <span id="poi-coords" style="color: var(--accent-amber); font-weight: bold;">N 00° 00.000 W 000° 00.000</span></div>
            <div style="margin-top: 4px;"><strong>TERRAIN:</strong> <span id="poi-terrain" style="color: #d1fae5;">Terrain description</span></div>
          </div>
          <div class="poi-action-grid">
            <button class="btn-cipher primary" onclick="window.location.href='mission.html'">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              <span>CRACK</span>
            </button>
            <button class="btn-cipher" onclick="CipherMap.openTravelModal()">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
              <span>TRAVEL</span>
            </button>
          </div>
        </section>

        <section id="travel-modal" class="travel-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="travel-header-title">
          <div class="travel-modal-card">
            <h2 id="travel-header-title" class="panel-header">SELECT TRAVEL MODE</h2>
            <div id="travel-options-list" class="travel-options-list"></div>
            <button class="btn-cipher" onclick="CipherMap.closeTravelModal()">[ CANCEL ]</button>
          </div>
        </section>
      </section>

      <aside class="rat-comms-dock" aria-label="Rat Pack CB Radio Channel 19">
        <span class="rat-comms-channel" aria-label="Channel 19">CH 19</span>
        <div class="s-meter-block" aria-hidden="true">
          <span>SIG:</span>
          <div class="s-meter-bar">
            <div class="s-meter-seg"></div>
            <div class="s-meter-seg"></div>
            <div class="s-meter-seg"></div>
            <div class="s-meter-seg"></div>
            <div class="s-meter-seg"></div>
          </div>
        </div>
        <div id="comms-ticker" class="rat-comms-ticker" role="status" aria-live="polite" aria-atomic="true">[SCANNING RAT CH 19...]</div>
      </aside>
    </main>

    <nav class="nav-anchor-strip" aria-label="Primary Navigation">
      <a href="mission.html" class="nav-tab">
        <svg class="ui-icon ui-icon-nav" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <span>MISSION</span>
      </a>
      <a href="map.html" class="nav-tab active" aria-current="page">
        <svg class="ui-icon ui-icon-nav" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
        <span>MAP</span>
      </a>
      <a href="pack.html" class="nav-tab">
        <svg class="ui-icon ui-icon-nav" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 10a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10z"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path></svg>
        <span>PACK</span>
      </a>
      <a href="profile.html" class="nav-tab">
        <svg class="ui-icon ui-icon-nav" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>MENU</span>
      </a>
    </nav>
  </div>

  <script src="js/cipher-audio.js"></script>
  <script src="js/cipher-core.js"></script>
  <script src="js/cipher-map.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof CipherMap !== 'undefined') CipherMap.init();
      const state = (typeof CipherCore !== 'undefined') ? CipherCore.getState() : { meta: {} };
      const themeToggle = document.getElementById('btn-theme-toggle');
      if (themeToggle) {
        themeToggle.textContent = (state.meta.theme || 'crt') === 'crt' ? '[ CRT VECTOR ]' : '[ TOPO BLUEPRINT ]';
      }
    });
  </script>
</body>
</html>
