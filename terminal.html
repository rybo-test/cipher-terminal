  <script>
    // --- Audio Synthesis Engine (Web Audio API) ---
    let audioContext = null;
    let audioEnabled = true;

    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTone(freq, type = "square", duration = 0.08, delay = 0) {
      if (!audioEnabled) return;
      initAudio();
      setTimeout(() => {
        try {
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioContext.currentTime);
          gain.gain.setValueAtTime(0.04, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioContext.destination);
          osc.start();
          osc.stop(audioContext.currentTime + duration);
        } catch (e) {}
      }, delay * 1000);
    }

    function soundBeep() { playTone(880, "sine", 0.05); }
    function soundKey() { playTone(1200 + Math.random() * 200, "square", 0.015); }
    function soundAdmin() {
      playTone(587.33, "triangle", 0.08, 0);
      playTone(880, "triangle", 0.12, 0.08);
      playTone(1174.66, "triangle", 0.2, 0.18);
    }
    function soundError() {
      playTone(150, "sawtooth", 0.15, 0);
      playTone(110, "sawtooth", 0.25, 0.15);
    }
    function soundSuccess() {
      playTone(440, "sine", 0.08, 0);
      playTone(554.37, "sine", 0.08, 0.08);
      playTone(659.25, "sine", 0.12, 0.16);
      playTone(880, "sine", 0.25, 0.24);
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById("audioBtn").innerText = audioEnabled ? "🔊 AUDIO: ON" : "🔇 AUDIO: MUTED";
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (audioEnabled) soundBeep();
    }

    // --- Font Size Controller ---
    const fontSizes = ["sm", "md", "lg"];
    const fontLabels = { sm: "🔠 FONT: SMALL", md: "🔠 FONT: MED", lg: "🔠 FONT: LARGE" };

    function setFontSize(size) {
      if (!fontSizes.includes(size)) size = "md";
      document.body.classList.remove("font-sm", "font-md", "font-lg");
      document.body.classList.add(`font-${size}`);
      localStorage.setItem("cipher_font_size", size);
      const btn = document.getElementById("fontBtn");
      if (btn) btn.innerText = fontLabels[size];
    }

    function cycleFontSize() {
      const current = localStorage.getItem("cipher_font_size") || "md";
      const nextIdx = (fontSizes.indexOf(current) + 1) % fontSizes.length;
      setFontSize(fontSizes[nextIdx]);
      soundBeep();
    }

    // --- Terminal State & Telemetry Configuration ---
    const outputEl = document.getElementById("termOutput");
    const inputEl = document.getElementById("cliInput");
    const adminChipEl = document.getElementById("adminChip");
    const headerStatusEl = document.getElementById("headerStatus");

    // Live GAS endpoint (Deploy as Web App, Accessible to Anyone)
    const GAS_ENDPOINT = ""; 

    const CONFIG = {
      version: "v1.18-FIELD",
      node01Key: "BLUE-SWITCH",
      certitudeWord: "BLUE-SWITCH-2000",
      practiceKey: "CAESAR",
      practiceToken: "TOKEN-PRACTICE-99",
      ratPackRoster: ["NEZZMUK", "RATWAFFLES", "CHEDA", "MUGGLEMISFIT"],
      validTokens: {
        "TOKEN-PT-01": { name: "Relay Node 01", sector: "Cache Valley Gate" },
        "TOKEN-PT-02": { name: "Relay Node 02", sector: "Corridor Fence Line" },
        "TOKEN-PT-03": { name: "Relay Node 03", sector: "Railway Siding" }
      }
    };

    // 20-Slot CLI Command History Stack
    const cmdHistory = [];
    let historyIdx = -1;

    // Awaiting Admin PIN State
    let awaitingAdminPin = false;

    function getState() {
      return {
        handle: localStorage.getItem("cipher_handle") || "ANONYMOUS_CACHER",
        clearance: parseInt(localStorage.getItem("cipher_clearance") || "0", 10),
        ingested: JSON.parse(localStorage.getItem("cipher_tokens") || "[]"),
        syncQueue: JSON.parse(localStorage.getItem("cipher_sync_queue") || "[]")
      };
    }

    function saveState(state) {
      localStorage.setItem("cipher_handle", state.handle);
      localStorage.setItem("cipher_clearance", state.clearance.toString());
      localStorage.setItem("cipher_tokens", JSON.stringify(state.ingested));
      localStorage.setItem("cipher_sync_queue", JSON.stringify(state.syncQueue));
      evaluateAdminVisibility();
    }

    function isRatPack(handle) {
      return CONFIG.ratPackRoster.includes((handle || "").toUpperCase().trim());
    }

    function evaluateAdminVisibility() {
      const state = getState();
      adminChipEl.style.display = isRatPack(state.handle) ? "inline-block" : "none";
    }

    function printBlock(contentHtml, type = "") {
      const card = document.createElement("div");
      card.className = `term-block ${type}`.trim();
      card.innerHTML = contentHtml;
      outputEl.appendChild(card);
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    function printEcho(rawInput) {
      const echo = document.createElement("div");
      echo.className = "user-echo";
      echo.innerText = `C.I.P.H.E.R.> ${rawInput}`;
      outputEl.appendChild(echo);
    }

    function clearScreen() {
      outputEl.innerHTML = "";
    }

    // --- Two-Way Telemetry Sync (GAS & Fallback) ---
    async function fetchTelemetry() {
      if (!navigator.onLine) {
        headerStatusEl.innerText = "RELAY: OFFLINE // NO CONNECTION";
        return;
      }
      headerStatusEl.innerText = "SYSOP RELAY: SYNCING...";
      const targetUrl = GAS_ENDPOINT ? `${GAS_ENDPOINT}?action=READ` : `telemetry.json?v=${Date.now()}`;
      try {
        const res = await fetch(targetUrl, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP error");
        const data = await res.json();
        const globalTokens = data.GlobalTokensIngested || data.global_tokens_ingested || 0;
        const nodesOnline = data.NodesOnline || data.nodes_online || 2;
        headerStatusEl.innerText = `RELAY: ONLINE // GLOBAL TOKENS: ${globalTokens} // NODES: ${nodesOnline}`;
        flushSyncQueue();
      } catch (e) {
        headerStatusEl.innerText = "RELAY: OFFLINE // LOCAL RUNNING";
      }
    }

    async function sendIngestToRelay(tokenId, handle) {
      if (!GAS_ENDPOINT || !navigator.onLine) return false;
      try {
        const res = await fetch(GAS_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "INGEST_TOKEN",
            tokenId: tokenId,
            callsign: handle,
            clientVersion: CONFIG.version
          })
        });
        const resp = await res.json();
        return resp.success === true;
      } catch (e) {
        return false;
      }
    }

    async function verifyAdminPinWithRelay(pin) {
      const cleanPin = String(pin || "").trim();
      if (!GAS_ENDPOINT || !navigator.onLine) {
        return cleanPin === "8675309";
      }
      try {
        const res = await fetch(GAS_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "VERIFY_PIN", pin: cleanPin })
        });
        const resp = await res.json();
        return resp.success === true;
      } catch (e) {
        return cleanPin === "8675309"; // Bulletproof local fallback
      }
    }

    async function flushSyncQueue() {
      const state = getState();
      if (!state.syncQueue.length || !GAS_ENDPOINT || !navigator.onLine) return;
      const queue = [...state.syncQueue];
      state.syncQueue = [];
      saveState(state);

      for (const item of queue) {
        const success = await sendIngestToRelay(item.token, item.handle);
        if (!success) {
          state.syncQueue.push(item);
        }
      }
      saveState(state);
    }

    // --- Rat Pack Gated Admin Console ---
    async function handleAdminCommand(arg) {
      const state = getState();
      if (!isRatPack(state.handle)) {
        soundError();
        printBlock(`
          <div class="term-title"><span>⛔ ACCESS DENIED</span></div>
          <p>Operator callsign '<strong>${state.handle}</strong>' is NOT authorized for S.O.S. Administrative Root.</p>
          <div class="term-dim">Rat Pack clearance required. Use <code>HANDLE &lt;NAME&gt;</code> if you are an authorized pack member.</div>
        `, "error");
        return;
      }

      // If user provided argument (e.g. 'ADMIN 8675309')
      if (arg) {
        const isValid = await verifyAdminPinWithRelay(arg);
        if (isValid) {
          grantAdminAccess(state.handle);
        } else {
          soundError();
          printBlock(`<div class="term-title"><span>⛔ PIN REJECTED</span></div><p>Invalid 7-digit SysOp PIN.</p>`, "error");
        }
        return;
      }

      // Otherwise trigger interactive prompt
      if (!awaitingAdminPin) {
        awaitingAdminPin = true;
        soundBeep();
        printBlock(`
          <div class="term-title"><span>🔐 S.O.S. ROOT CHALLENGE</span></div>
          <p>Welcome, Rat Pack operative. Enter your <strong>7-digit SysOp Admin PIN</strong> below:</p>
          <div class="term-dim">Prompt locked: Type your 7-digit PIN and press Enter.</div>
        `, "admin");
        return;
      }

      // Processing entered PIN from prompt
      const pinInput = arg || inputEl.value;
      const isValid = await verifyAdminPinWithRelay(pinInput);
      awaitingAdminPin = false;

      if (isValid) {
        grantAdminAccess(state.handle);
      } else {
        soundError();
        printBlock(`
          <div class="term-title"><span>⛔ PIN AUTHENTICATION FAILED</span></div>
          <p>PIN challenge rejected. Security trip logged to Google Sheet audit ledger.</p>
        `, "error");
      }
    }

    function grantAdminAccess(handle) {
      soundAdmin();
      printBlock(`
        <div class="term-title">
          <span>⚡ Rat Pack SysOp Command Console</span>
          <span class="term-dim">OPERATOR: ${handle}</span>
        </div>
        <p>7-Digit PIN Verified. Root access granted:</p>
        <div class="term-row"><span class="term-val">ADMIN RESET</span><span class="term-label">Purge local state for clean trail testing</span></div>
        <div class="term-row"><span class="term-val">ADMIN UNLOCKALL</span><span class="term-label">Elevate device to Level 5 clearance</span></div>
        <div class="term-row"><span class="term-val">ADMIN SYNC</span><span class="term-label">Force immediate flush of offline queue</span></div>
        <div class="term-dim" style="margin-top: 6px;">Admin session active.</div>
      `, "admin");
    }

    // --- Command Processing Engine ---
    async function processCommand(rawInput) {
      const clean = rawInput.trim();
      if (!clean) return;

      printEcho(clean);

      // Record in 20-slot history buffer
      cmdHistory.unshift(clean);
      if (cmdHistory.length > 20) cmdHistory.pop();
      historyIdx = -1;

      // Handle ongoing Admin PIN prompt
      if (awaitingAdminPin) {
        await handleAdminCommand(clean);
        return;
      }

      const parts = clean.split(/\s+/);
      const cmd = parts[0].toUpperCase();
      const arg = parts.slice(1).join(" ").trim();
      const state = getState();

      switch (cmd) {
        case "HELP":
        case "?":
          soundBeep();
          showHelp();
          break;

        case "CLEAR":
        case "CLS":
          clearScreen();
          break;

        case "STATUS":
        case "DIAG":
          soundBeep();
          showStatus();
          break;

        case "PROFILE":
        case "WHOAMI":
        case "ID":
          soundBeep();
          showProfile();
          break;

        case "TRAIN":
        case "PRACTICE":
          showTrain(arg);
          break;

        case "ADMIN":
        case "SYSOP":
        case "ROOT":
          await handleAdminCommand(arg);
          break;

        case "MAP":
        case "GRID":
        case "NODES":
          soundBeep();
          showMap();
          break;

        case "FONT":
        case "FONTSIZE":
        case "TEXT":
          if (!arg) {
            cycleFontSize();
            printBlock(`
              <div class="term-title"><span>🔠 Font Size Updated</span></div>
              <p>Current setting: <strong>${(localStorage.getItem("cipher_font_size") || "md").toUpperCase()}</strong></p>
            `);
          } else {
            const target = arg.toLowerCase();
            if (["sm", "small", "1"].includes(target)) setFontSize("sm");
            else if (["lg", "large", "3"].includes(target)) setFontSize("lg");
            else setFontSize("md");
            printBlock(`
              <div class="term-title"><span>🔠 Font Size Updated</span></div>
              <p>Current setting: <strong>${(localStorage.getItem("cipher_font_size") || "md").toUpperCase()}</strong></p>
            `, "success");
          }
          break;

        case "SLEUTH":
        case "CASE":
        case "CLUE":
          soundBeep();
          showSleuth();
          break;

        case "UNLOCK":
        case "AUTH":
        case "CODE":
        case "PASS":
          if (!arg) {
            soundError();
            printBlock(`
              <div class="term-title"><span>⚠️ Missing Passcode</span></div>
              <p>You must provide the decoded secret word!</p>
              <div class="term-dim">Syntax: <code>UNLOCK &lt;WORD&gt;</code></div>
            `, "error");
            return;
          }
          if (arg.toUpperCase() === CONFIG.practiceKey) {
            soundSuccess();
            printBlock(`
              <div class="term-title"><span>🎓 TRAIN 2 Complete!</span></div>
              <p>Practice passcode accepted! You simulated cracking a real cipher.</p>
              <div class="term-dim">Now hit [ 🔍 SLEUTH ] to tackle the live Node 01 hide!</div>
            `, "success");
          } else if (arg.toUpperCase() === CONFIG.node01Key) {
            soundSuccess();
            state.clearance = Math.max(state.clearance, 1);
            saveState(state);
            printBlock(`
              <div class="term-title">
                <span>🔓 Access Granted // Level 1 Clearance</span>
                <span class="term-dim">VERIFIED</span>
              </div>
              <p>Relay tumblers disengaged. S.O.S. network coordinates unlocked.</p>
              <div class="term-callout">
                <div style="font-size: 0.9em; margin-bottom: 4px;">CERTITUDE VALIDATION KEYWORD:</div>
                <div class="term-callout-code">${CONFIG.certitudeWord}</div>
              </div>
              <div class="term-dim">
                Enter this keyword into the Certitude checker on the Geocaching listing to get physical GZ and parking coordinates!
              </div>
            `, "success");
          } else {
            soundError();
            printBlock(`
              <div class="term-title"><span>⛔ Passcode Rejected</span></div>
              <p>[BZZZT!] Passcode '${arg}' produced pure radio static.</p>
              <div class="term-dim">Tip: Re-verify your Caesar shift (+3) in CacheSleuth and try again.</div>
            `, "error");
          }
          break;

        case "FEED":
        case "INGEST":
        case "TOKEN":
          if (!arg) {
            soundError();
            printBlock(`
              <div class="term-title"><span>⚠️ Missing Token Code</span></div>
              <p>You must provide the code stamped on the physical container!</p>
              <div class="term-dim">Syntax: <code>FEED &lt;TOKEN-CODE&gt;</code></div>
            `, "error");
            return;
          }
          const tokenUpper = arg.toUpperCase();
          if (tokenUpper === CONFIG.practiceToken) {
            soundSuccess();
            printBlock(`
              <div class="term-title"><span>🎓 TRAIN 3 Complete!</span></div>
              <p>Practice token ingested successfully! In the field, doing this restores real memory sectors and activates new nodes.</p>
            `, "success");
          } else if (CONFIG.validTokens[tokenUpper]) {
            if (state.ingested.includes(tokenUpper)) {
              soundBeep();
              printBlock(`
                <div class="term-title"><span>ℹ️ Token Already Ingested</span></div>
                <p>Token <strong>${tokenUpper}</strong> is already registered to this terminal.</p>
              `, "alert");
            } else {
              soundSuccess();
              state.ingested.push(tokenUpper);
              saveState(state);

              // Tactile Ingestion Animation
              printBlock(`
                <div class="term-title">
                  <span>💾 Token Accepted // Memory Restored</span>
                  <span class="term-dim">${tokenUpper}</span>
                </div>
                <div class="term-row"><span class="term-label">Node Name</span><span class="term-val">${CONFIG.validTokens[tokenUpper].name}</span></div>
                <div class="term-row"><span class="term-label">Sector Restored</span><span class="term-val">${CONFIG.validTokens[tokenUpper].sector}</span></div>
                <p style="margin-top: 6px;">Memory sector ONLINE. Broadcasting telemetry to community ledger...</p>
              `, "success");

              // Connection-First Two-Way Write-back Handshake
              const isOnline = navigator.onLine;
              const sent = isOnline ? await sendIngestToRelay(tokenUpper, state.handle) : false;
              if (sent) {
                printBlock(`📡 <strong>COMMUNITY RELAY UPDATED:</strong> Google Sheet ledger incremented.`, "success");
              } else {
                state.syncQueue.push({ token: tokenUpper, handle: state.handle });
                saveState(state);
                printBlock(`📡 <strong>LOCAL PARITY VERIFIED:</strong> ${isOnline ? "Server timeout." : "Offline mode active."} Token cached in device memory. It will broadcast once signal returns.`, "alert");
              }
            }
          } else {
            soundError();
            printBlock(`
              <div class="term-title"><span>⛔ Invalid Token</span></div>
              <p>Unrecognized token hash '${arg}'. Verify the stamped alphanumeric string on the physical token.</p>
            `, "error");
          }
          break;

        case "HANDLE":
        case "NAME":
        case "USER":
          if (!arg) {
            printBlock(`
              <div class="term-title"><span>👤 Active Operator</span></div>
              <p>Current callsign: <strong>${state.handle}</strong></p>
            `);
          } else {
            state.handle = arg.toUpperCase();
            saveState(state);
            soundSuccess();
            printBlock(`
              <div class="term-title"><span>👤 Callsign Registered</span></div>
              <p>Operator identity saved as: <strong>${state.handle}</strong></p>
            `, "success");
          }
          break;

        case "KICK":
        case "HIT":
        case "BANG":
          soundError();
          printBlock(`
            <div class="term-title"><span>🔧 Percussive Maintenance</span></div>
            <p>*THWACK!* You kicked the steel junction box. A spider fell out, the tube flickered, and signal jumped 0.2%. Grandpa engineering at its finest!</p>
          `, "alert");
          break;

        case "COFFEE":
          soundError();
          printBlock(`
            <div class="term-title"><span>☕ Coffee Protocol</span></div>
            <p>ERROR 418: CD drive tray extended. Please do not rest your mug on the tray.</p>
          `, "alert");
          break;

        case "MUGGLE":
          soundBeep();
          printBlock(`
            <div class="term-title"><span>👀 Stealth Alert</span></div>
            <p>Muggle in vicinity! Pretend to tie your hiking boots and look casual.</p>
          `, "alert");
          break;

        default:
          soundError();
          printBlock(`
            <div class="term-title"><span>❓ Unrecognized Command</span></div>
            <p>Command '${clean}' not found in SysOp index.</p>
            <div class="term-dim">Don't panic! Tap <code>[ ❓ HELP ]</code> or <code>[ 🎓 TRAIN ]</code> to learn the ropes.</div>
          `, "error");
          break;
      }
    }

    function triggerAction(actionText) {
      if (actionText.endsWith(" ")) {
        inputEl.value = actionText;
        inputEl.focus();
      } else {
        processCommand(actionText);
      }
    }

    // --- Key Events & Scoped Touch Handling ---
    inputEl.addEventListener("keydown", (e) => {
      soundKey();
      if (e.key === "Enter") {
        const val = inputEl.value;
        inputEl.value = "";
        processCommand(val);
      } else if (e.key === "ArrowUp") {
        if (cmdHistory.length && historyIdx < cmdHistory.length - 1) {
          historyIdx++;
          inputEl.value = cmdHistory[historyIdx];
        }
      } else if (e.key === "ArrowDown") {
        if (historyIdx > 0) {
          historyIdx--;
          inputEl.value = cmdHistory[historyIdx];
        } else if (historyIdx === 0) {
          historyIdx = -1;
          inputEl.value = "";
        }
      }
    });

    // Android/Mobile Friendly: Only prompt line or action chips trigger keyboard focus
    document.getElementById("promptWrapper").addEventListener("click", () => {
      inputEl.focus();
    });

    window.addEventListener("DOMContentLoaded", () => {
      setFontSize(localStorage.getItem("cipher_font_size") || "md");
      evaluateAdminVisibility();
      showBanner();
      fetchTelemetry();

      const params = new URLSearchParams(window.location.search);
      const urlToken = params.get("token");
      if (urlToken) {
        setTimeout(() => {
          printBlock(`
            <div class="term-title"><span>📡 Field Token Detected</span></div>
            <p>Processing scanned URL parameter: <strong>${urlToken}</strong></p>
          `, "alert");
          processCommand(`FEED ${urlToken}`);
        }, 800);
      }
    });
  </script>
</body>
</html>
