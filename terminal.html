<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>C.I.P.H.E.R. // Cache Tales Field Transceiver</title>
  <style>
    :root {
      --bg-color: #080d0a;
      --term-green: #00ff66;
      --term-dim: #008833;
      --term-alert: #ffaa00;
      --term-error: #ff3333;
      --term-rat: #33ccff;
      --font-size-base: 15px;
      --input-size-base: 16px;
    }

    * { box-sizing: border-box; }

    html, body {
      background-color: var(--bg-color);
      color: var(--term-green);
      font-family: 'Courier New', Courier, monospace;
      font-size: var(--font-size-base);
      margin: 0;
      padding: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      padding: 8px 10px;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }

    #header-bar {
      border-bottom: 1px dashed var(--term-dim);
      padding-bottom: 5px;
      margin-bottom: 6px;
      font-size: 0.8em;
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex-shrink: 0;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #terminal-screen {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
      scroll-behavior: smooth;
    }

    .term-block {
      border-left: 3px solid var(--term-green);
      padding-left: 8px;
      margin-bottom: 2px;
      word-break: break-word;
    }

    .term-block.alert { border-left-color: var(--term-alert); color: var(--term-alert); }
    .term-block.error { border-left-color: var(--term-error); color: var(--term-error); }
    .term-block.ratlab { border-left-color: var(--term-rat); color: var(--term-rat); }

    .term-title {
      font-weight: bold;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .term-dim {
      color: var(--term-dim);
      font-size: 0.85em;
    }

    #action-deck {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 6px 0;
      flex-shrink: 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #action-deck::-webkit-scrollbar { display: none; }

    .action-chip {
      background: rgba(0, 255, 102, 0.08);
      border: 1px solid var(--term-dim);
      color: var(--term-green);
      padding: 8px 12px;
      font-family: inherit;
      font-size: 0.78em;
      white-space: nowrap;
      text-align: center;
      cursor: pointer;
      border-radius: 3px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .action-chip:active {
      background: var(--term-green);
      color: var(--bg-color);
    }

    .action-chip.ratlab-chip {
      border-color: var(--term-rat);
      color: var(--term-rat);
      background: rgba(51, 204, 255, 0.08);
    }
    .action-chip.ratlab-chip:active {
      background: var(--term-rat);
      color: var(--bg-color);
    }

    #input-form {
      display: flex;
      align-items: center;
      gap: 6px;
      border-top: 1px dashed var(--term-dim);
      padding-top: 6px;
      background: var(--bg-color);
      flex-shrink: 0;
    }

    .nav-btn {
      background: rgba(0, 255, 102, 0.08);
      border: 1px solid var(--term-dim);
      color: var(--term-green);
      font-family: inherit;
      font-size: 0.75em;
      padding: 4px 6px;
      cursor: pointer;
      border-radius: 2px;
      user-select: none;
      line-height: 1;
    }
    .nav-btn:active {
      background: var(--term-green);
      color: var(--bg-color);
    }

    #prompt-symbol {
      color: var(--term-green);
      font-weight: bold;
      font-size: 1.1em;
      user-select: none;
    }

    #cli-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--term-green);
      font-family: 'Courier New', Courier, monospace;
      font-size: var(--input-size-base);
      outline: none;
      padding: 6px 0;
      border-radius: 0;
      -webkit-appearance: none;
    }

    a.term-link {
      color: var(--term-green);
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      #app-container { padding: 6px 8px; }
      .action-chip { padding: 8px 10px; font-size: 0.8em; }
      #cli-input { font-size: 16px; }
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="header-bar">
      <div class="header-row">
        <span id="sat-link">GPS FIX: ACQUIRING CONSTELLATION...</span>
        <span id="cacher-id">CACHER: UNREGISTERED</span>
      </div>
      <div class="header-row term-dim">
        <span id="mem-status">TRAIL MEMORY: 3.1%</span>
        <span id="bat-status">POWER LEVEL: 84% [SUN JUICE: GOOD]</span>
      </div>
    </div>

    <div id="terminal-screen">
      <!-- Dynamic onboarding blocks appear here -->
    </div>

    <div id="action-deck">
      <!-- Contextual Action Chips populated dynamically -->
    </div>

    <form id="input-form" onsubmit="handleLogSubmit(event)">
      <button type="button" class="nav-btn" title="Previous Command" onclick="historyCycle(-1)">▲</button>
      <button type="button" class="nav-btn" title="Next Command" onclick="historyCycle(1)">▼</button>
      <span id="prompt-symbol">&gt;</span>
      <input type="text" id="cli-input" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="Enter trail command...">
    </form>
  </div>

  <script>
    const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycby19PaTlJJGeSlRyYhOjHnbL5px5JoKqzOuUQku9m_Pt_vy1n_X1RoiUpITqm_K37TH/exec";

    const GPS_CONSTELLATION = [
      "NAVSTAR-34 (PRN-18)", "GPS-BIIR-2 (PRN-13)", "USA-132 (WAAS-L1)", 
      "NAVSTAR-IIA (PRN-24)", "GPS-BIIF-9 (PRN-06)"
    ];

    let inRatLabMode = false;
    let awaitingPinForLab = false;
    let awaitingUsernameEntry = false;
    let pendingUsernameCandidate = "";
    let isPhysicalGZMode = false;
    let simulatedBattery = 84;
    let simulatedSolarFault = "OK";
    let audioMuted = false;

    // Authorized corridor physical stage tokens & items
    const VALID_STAGES = new Set([
      "STAGE_01_GZ", "STAGE_02_GZ", "STAGE_03_GZ", "STAGE_04_GZ", "STAGE_05_GZ",
      "STAGE_08_GZ", "STAGE_17_GZ", "STAGE_25_GZ", "STAGE_50_GZ", "STAGE_00_LAB"
    ]);

    const VALID_ITEMS = new Set([
      "BRASS_WASHER", "PANEL-40W-SOLAR", "CELL-12V-LEAD", "CORRIDOR-ANTENNA",
      "MEMORY-CORE-EXP", "RAT_BRAIN_V1", "TB-WOODEN-01", "2004_ARBYS_COUPON"
    ]);

    // --- PROCEDURAL AUDIO & MODEM VOICE ENGINE ---
    let audioCtx = null;

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (audioMuted) return;
      try {
        initAudioContext();
        const now = audioCtx.currentTime;

        if (type === 'TICK') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(1200, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.015);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.015);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.015);
        } 
        else if (type === 'KICK') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(120, now);
          osc.frequency.exponentialRampToValueAtTime(35, now + 0.15);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        }
        else if (type === 'BUZZ') {
          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc1.type = 'square';
          osc2.type = 'sawtooth';
          osc1.frequency.setValueAtTime(90, now);
          osc2.frequency.setValueAtTime(93, now);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(audioCtx.destination);
          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.2);
          osc2.stop(now + 0.2);
        }
        else if (type === 'CHIME') {
          [523.25, 659.25, 783.99].forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + (i * 0.08));
            gain.gain.setValueAtTime(0.1, now + (i * 0.08));
            gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.08) + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + (i * 0.08));
            osc.stop(now + (i * 0.08) + 0.25);
          });
        }
        else if (type === 'MODEM') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(1400, now);
          osc.frequency.linearRampToValueAtTime(2200, now + 0.1);
          osc.frequency.linearRampToValueAtTime(900, now + 0.2);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (err) {}
    }

    function speakCypher(text) {
      if (audioMuted || !window.speechSynthesis) return;
      try {
        window.speechSynthesis.cancel();
        playSound('MODEM');

        setTimeout(() => {
          let spokenText = text.replace(/<[^>]*>/g, '');
          const memoryParity = parseFloat(calculateStageRestoration());

          if (memoryParity < 20) {
            spokenText = "Static... corrupted trail memory... " + spokenText.substring(0, 45) + "... transmission lost.";
          }

          const utterance = new SpeechSynthesisUtterance(spokenText);
          
          if (simulatedBattery <= 19) {
            utterance.pitch = 0.6;
            utterance.rate = 0.75;
          } else if (simulatedBattery <= 59) {
            utterance.pitch = 0.85;
            utterance.rate = 0.9;
          } else {
            utterance.pitch = 1.0;
            utterance.rate = 1.05;
          }

          window.speechSynthesis.speak(utterance);
        }, 300);
      } catch (err) {}
    }

    // --- COMMAND HISTORY ---
    const TRAIL_HISTORY_MAX = 30;
    let trailCommandHistory = [];
    let trailHistoryPointer = -1;
    let trailDraftInput = "";

    function recordHistory(commandText) {
      if (!commandText || (trailCommandHistory.length > 0 && trailCommandHistory[trailCommandHistory.length - 1] === commandText)) {
        trailHistoryPointer = -1;
        return;
      }
      trailCommandHistory.push(commandText);
      if (trailCommandHistory.length > TRAIL_HISTORY_MAX) {
        trailCommandHistory.shift();
      }
      trailHistoryPointer = -1;
      trailDraftInput = "";
    }

    function historyCycle(direction) {
      playSound('TICK');
      const input = document.getElementById("cli-input");
      if (trailCommandHistory.length === 0) return;

      if (trailHistoryPointer === -1) {
        trailDraftInput = input.value;
        trailHistoryPointer = trailCommandHistory.length;
      }

      trailHistoryPointer += direction;

      if (trailHistoryPointer < 0) {
        trailHistoryPointer = 0;
      } else if (trailHistoryPointer >= trailCommandHistory.length) {
        trailHistoryPointer = trailCommandHistory.length;
        input.value = trailDraftInput;
        return;
      }

      input.value = trailCommandHistory[trailHistoryPointer];
      setTimeout(() => {
        input.selectionStart = input.selectionEnd = input.value.length;
      }, 0);
    }

    document.getElementById("cli-input").addEventListener("keydown", function(e) {
      if (e.key === "ArrowUp") {
        e.preventDefault();
        historyCycle(-1);
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        historyCycle(1);
      } else {
        playSound('TICK');
      }
    });

    // --- MOBILE VIEWPORT & SCROLL ---
    function adjustForMobileViewport() {
      if (window.visualViewport) {
        const height = window.visualViewport.height;
        document.getElementById("app-container").style.height = `${height}px`;
        scrollTerminalToGZ();
      }
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", adjustForMobileViewport);
      window.visualViewport.addEventListener("scroll", adjustForMobileViewport);
    }

    function scrollTerminalToGZ() {
      const screen = document.getElementById("terminal-screen");
      screen.scrollTop = screen.scrollHeight;
    }

    // --- CACHER DOSSIER STATE ---
    function getCacherDossier() {
      let profile = {};
      try {
        profile = JSON.parse(localStorage.getItem("cipher_profile") || "{}");
      } catch (e) {}

      return {
        username: localStorage.getItem("cipher_gc_name") || "",
        syncKey: localStorage.getItem("cipher_sync_key") || generateSyncKey(),
        ratBrainUnlocked: localStorage.getItem("cipher_rat_brain") === "true",
        profileData: Object.assign({
          stagesLogged: ["STAGE_01_GZ"],
          inventory: ["BRASS_WASHER"],
          fieldNotes: [],
          collectedSwag: [],
          unlockedTools: [],
          settings: { soundEnabled: true, highContrast: false }
        }, profile)
      };
    }

    function generateSyncKey() {
      const key = "CYPHER-SYNC-" + Math.random().toString(36).substring(2, 6).toUpperCase() + "-" + Math.random().toString(36).substring(2, 6).toUpperCase();
      localStorage.setItem("cipher_sync_key", key);
      return key;
    }

    function saveCacherDossier(dossier) {
      if (dossier.username) {
        localStorage.setItem("cipher_gc_name", dossier.username);
      }
      localStorage.setItem("cipher_sync_key", dossier.syncKey);
      localStorage.setItem("cipher_rat_brain", dossier.ratBrainUnlocked ? "true" : "false");
      localStorage.setItem("cipher_profile", JSON.stringify(dossier.profileData));
      updateFieldVitals();
    }

    function calculateStageRestoration() {
      const dossier = getCacherDossier();
      let restored = 3.1;
      const count = (dossier.profileData.stagesLogged || []).length;
      restored += Math.min(count * 0.4, 96.9);
      return restored.toFixed(1);
    }

    function updateFieldVitals() {
      const dossier = getCacherDossier();
      document.getElementById("cacher-id").innerText = `CACHER: ${dossier.username || "UNREGISTERED"}`;
      document.getElementById("mem-status").innerText = `TRAIL MEMORY: ${calculateStageRestoration()}%`;
      
      let statusStr = `${simulatedBattery}%`;
      if (simulatedBattery <= 19) {
        statusStr += " [CRITICAL STANDBY]";
      } else if (simulatedBattery <= 59) {
        statusStr += " [BROWNOUT]";
      } else {
        statusStr += simulatedSolarFault === "DIRTY_GLASS" ? " [SOLAR DEGRADED]" : " [SUN JUICE: GOOD]";
      }
      document.getElementById("bat-status").innerText = `POWER LEVEL: ${statusStr}`;
    }

    function acquireGpsFix() {
      if (navigator.onLine) {
        const sat = GPS_CONSTELLATION[Math.floor(Math.random() * GPS_CONSTELLATION.length)];
        document.getElementById("sat-link").innerText = `GPS FIX: ${sat} // LOCKED`;
      } else {
        document.getElementById("sat-link").innerText = `GPS FIX: OFFLINE // GROUND TRAIL SEARCH`;
      }
    }

    function printBlock(htmlContent, type = "") {
      const screen = document.getElementById("terminal-screen");
      const block = document.createElement("div");
      block.className = `term-block ${type}`;
      block.innerHTML = htmlContent;
      screen.appendChild(block);
      scrollTerminalToGZ();
    }

    // --- CLOUD FIELD LOGGING ---
    async function transmitFieldLog(action, fieldDetails = {}) {
      if (!GAS_ENDPOINT || !GAS_ENDPOINT.includes("exec")) return;
      try {
        const dossier = getCacherDossier();
        if (!dossier.username) return;
        const baseTransmission = {
          action: action,
          username: dossier.username,
          syncKey: dossier.syncKey,
          containerToken: "NONE",
          cacheStage: "STAGE_01_GZ",
          containerCondition: inRatLabMode ? "RAT_LAB_ISOLATED" : (isPhysicalGZMode ? "PHYSICAL_AMMO_CAN" : "REMOTE_CACHE_PAGE"),
          isRatLabTest: inRatLabMode
        };
        const searchParams = new URLSearchParams(Object.assign(baseTransmission, fieldDetails));
        fetch(`${GAS_ENDPOINT}?${searchParams.toString()}`).catch(() => {});
      } catch (err) {}
    }

    async function syncDossierToCloud() {
      const dossier = getCacherDossier();
      if (!dossier.username) return;
      await transmitFieldLog("SAVE_DOSSIER", {
        ratBrainUnlocked: dossier.ratBrainUnlocked,
        profileData: JSON.stringify(dossier.profileData)
      });
    }

    async function restoreDossierFromCloud(syncKey) {
      if (!GAS_ENDPOINT || !GAS_ENDPOINT.includes("exec")) return;
      printBlock(`<div class="term-dim">Scanning corridor archives for sync key ${syncKey}...</div>`);
      try {
        const res = await fetch(`${GAS_ENDPOINT}?action=GET_DOSSIER&syncKey=${encodeURIComponent(syncKey)}`);
        const data = await res.json();
        if (data.success) {
          saveCacherDossier({
            username: data.username,
            syncKey: data.syncKey,
            ratBrainUnlocked: data.ratBrainUnlocked,
            profileData: data.profileData
          });
          printBlock(`
            <div class="term-title"><span>📡 CACHER DOSSIER RESTORED</span></div>
            <p>Welcome back to the corridor, <strong>${data.username}</strong>!<br>
            Containers stamped: ${(data.profileData.stagesLogged || []).length} | Swag &amp; Trackables: ${(data.profileData.inventory || []).length}.<br>
            Rat Brain status: <strong>${data.ratBrainUnlocked ? "MOUNTED" : "DORMANT"}</strong>.</p>
          `);
          speakCypher("Dossier restored. Welcome back to the trail.");
          renderDynamicActionDeck();
        } else {
          printBlock(`<div class="term-title"><span>⛔ SYNC FAILED</span></div><p>No cacher dossier found matching key '${syncKey}'.</p>`, "error");
        }
      } catch (err) {
        printBlock(`<p class="error">Timeout while restoring cacher dossier from cloud.</p>`, "error");
      }
    }

    function showSyncDossier() {
      const dossier = getCacherDossier();
      const currentUrl = window.location.origin + window.location.pathname;
      const syncUrl = `${currentUrl}?sync=${dossier.syncKey}`;
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(syncUrl)}`;

      syncDossierToCloud();

      printBlock(`
        <div class="term-title"><span>🔄 MULTI-DEVICE DOSSIER SYNC</span></div>
        <p><strong>Cacher:</strong> ${dossier.username}<br>
        <strong>Sync Key:</strong> <code>${dossier.syncKey}</code></p>
        <p>Open this session on your desktop or secondary field phone:<br>
        <a class="term-link" href="${syncUrl}" target="_blank">${syncUrl}</a></p>
        <div style="background:white; padding:6px; display:inline-block; border-radius:4px; margin:4px 0;">
          <img src="${qrApiUrl}" alt="Trail Sync QR" width="140" height="140" style="display:block;">
        </div>
        <div class="term-dim">Scan with another camera to transfer your finds, inventory, and field tools.</div>
      `);
      speakCypher("Multi-device sync link generated.");
    }

    // --- DYNAMIC ADAPTIVE ACTION DECK ---
    function renderDynamicActionDeck() {
      const deck = document.getElementById("action-deck");
      const dossier = getCacherDossier();

      if (inRatLabMode) {
        deck.innerHTML = `
          <button class="action-chip ratlab-chip" onclick="executeTrailCommand('RATBRAIN')">[ 🧠 RAT BRAIN ]</button>
          <button class="action-chip ratlab-chip" onclick="executeTrailCommand('LAB HARDWARE')">[ ⚡ HARDWARE ]</button>
          <button class="action-chip ratlab-chip" onclick="executeTrailCommand('LAB SOUND')">[ 🔊 TEST AUDIO ]</button>
          <button class="action-chip ratlab-chip" onclick="executeTrailCommand('LAB HELP')">[ 📖 BENCH HELP ]</button>
          <button class="action-chip ratlab-chip" onclick="executeTrailCommand('LAB PLANS')">[ 🗺️ TRAIL PLANS ]</button>
          <button class="action-chip ratlab-chip" onclick="executeTrailCommand('LAB EXIT')">[ 🚪 EXIT LAB ]</button>
        `;
        return;
      }

      if (awaitingUsernameEntry) {
        if (pendingUsernameCandidate) {
          deck.innerHTML = `
            <button class="action-chip" onclick="executeTrailCommand('YES')">[ ✅ CONFIRM USERNAME ]</button>
            <button class="action-chip" onclick="executeTrailCommand('NO')">[ ❌ RETRY ]</button>
            <button class="action-chip" onclick="executeTrailCommand('WHAT IS THIS')">[ ❓ WHAT IS THIS? ]</button>
          `;
        } else {
          deck.innerHTML = `
            <button class="action-chip" onclick="executeTrailCommand('WHAT IS THIS')">[ ❓ WHAT IS THIS? ]</button>
            <button class="action-chip" onclick="executeTrailCommand('HINT')">[ 💡 GZ HINT ]</button>
            <button class="action-chip" onclick="executeTrailCommand('KICK')">[ 🥾 KICK WELDS ]</button>
          `;
        }
        return;
      }

      let chips = [];

      // Context 1: Has salvage hardware in pack to mount
      const hasPanel = (dossier.profileData.inventory || []).includes("PANEL-40W-SOLAR");
      if (hasPanel && isPhysicalGZMode) {
        chips.push(`<button class="action-chip" onclick="executeTrailCommand('INSTALL PANEL-40W-SOLAR')">[ 🔧 BOLT ON 40W PANEL ]</button>`);
      }

      // Context 2: Critical standby power
      if (simulatedBattery <= 19) {
        chips.push(`<button class="action-chip" onclick="executeTrailCommand('HINT')">[ ⚡ RECHARGE HINT ]</button>`);
        chips.push(`<button class="action-chip" onclick="executeTrailCommand('LOG STAGE_01_GZ')">[ 📝 STAMP FIND ]</button>`);
        chips.push(`<button class="action-chip" onclick="executeTrailCommand('KICK')">[ 🥾 KICK CHASSIS ]</button>`);
      } else {
        // Standard field chips
        if (isPhysicalGZMode) {
          chips.push(`<button class="action-chip" onclick="executeTrailCommand('LOG')">[ 📝 SIGN LOGBOOK ]</button>`);

    function executeRatBrainQuery(query) {
      if (!query) {

          printBlock(`
            <div class="term-title"><span>C.I.P.H.E.R. // CONTAINER UNLATCHED</span></div>
            <p><strong>[CHASSIS UNLATCHED // DAYLIGHT DETECTED]</strong><br>
            Sunlight hitting the solar gasket. You actually tracked down the physical steel ammo can.<br>
            If you're here to log the cache, grab a pen, unroll the paper scroll, and don't try trading a pocket lint ball for that trackable.</p>
            <p><strong>[CYPHER]:</strong> "What username do you sign logbooks with, human bean?"</p>
          `, "alert");
          speakCypher("Chassis unlatched. What username do you sign logbooks with, human bean?");
        } else {
          // Coming remotely from cache page
          printBlock(`
            <div class="term-title"><span>C.I.P.H.E.R. // REMOTE CACHE LINK</span></div>
            <p><strong>[RSI REMOTE LINK // IRS FIELD AUDIT DIVISION]</strong><br>
            Remote signal acquired from the cache page. Well, look what pinged my frequency—another curious human bean.<br>
            If you're here to get help finding the cache, you've tapped into the right container. I've got eyes on the corridor, but my battery reserves are low and half my memory sectors are filled with rust.</p>
            <p><strong>[CYPHER]:</strong> "What username do you go by on the trail, geocacher?"</p>
          `, "alert");
          speakCypher("Remote link acquired from cache page. What username do you go by on the trail, geocacher?");
        }
      } else {
        // Returning Cacher
        printBlock(`
          <div class="term-title"><span>C.I.P.H.E.R. // FIELD TRANSCEIVER</span></div>
          <p>Container casing: 1/4-inch rolled rocket steel (RSI origin).<br>
          Welcome back to the corridor, <strong>${dossier.username}</strong>! Type <code>HELP</code> for trail directives.</p>
        `);
        speakCypher(`Welcome back, ${dossier.username}. Transceiver online.`);
      }

      updateFieldVitals();
      acquireGpsFix();
      renderDynamicActionDeck();
    }

    function isConversationalQuestion(input) {
      const qWords = ["WHAT", "WHY", "HOW", "WHO", "WHERE", "CAN", "IS", "HELP", "?"];
      const upper = input.toUpperCase().trim();
      return qWords.some(w => upper.startsWith(w) || upper.includes(w)) || upper.length > 22;
    }

    async function executeTrailCommand(commandText) {
      const cleanText = commandText.trim();
      if (!cleanText) return;

      recordHistory(cleanText);
      printBlock(`<span class="term-dim">&gt; ${cleanText}</span>`);

      const dossier = getCacherDossier();

      // Onboarding step: Resolving Username entry and confirmation
      if (awaitingUsernameEntry) {
        if (pendingUsernameCandidate) {
          // Confirmation sub-step
          const upper = cleanText.toUpperCase();
          if (upper === "Y" || upper === "YES" || upper.includes("CONFIRM") || upper.includes("THAT'S ME")) {
            dossier.username = pendingUsernameCandidate;
            awaitingUsernameEntry = false;
            pendingUsernameCandidate = "";
            saveCacherDossier(dossier);
            syncDossierToCloud();
            playSound('CHIME');
            printBlock(`
              <div class="term-title"><span>✅ USERNAME REGISTERED</span></div>
              <p>Welcome to the trail, <strong>${dossier.username}</strong>! Transceiver fully online.<br>
              Type <code>HELP</code> or tap the action chips below to navigate.</p>
            `);
            speakCypher(`Username confirmed. Welcome to the trail, ${dossier.username}.`);
            renderDynamicActionDeck();
            return;
          } else {
            pendingUsernameCandidate = "";
            printBlock(`<p>Let's try again. What is your exact Geocaching username?</p>`);
            speakCypher("What is your exact Geocaching username?");
            renderDynamicActionDeck();
            return;
          }
        }

        // Catch conversational questions instead of setting it as a name!
        if (isConversationalQuestion(cleanText)) {
          playSound('TICK');
          printBlock(`
            <div class="term-title"><span>[CYPHER // TRAIL DISPATCH]</span></div>
            <p>"Typical human bean—standing in the weeds scratching your head! You're holding an active IRS field transceiver bolted into a welded ammo can.<br>
            If you haven't found the container yet, ask for a <code>HINT</code>. If you're holding the box, sign the paper roll and keep my battery out of the dirt.<br>
            First off: what <strong>username</strong> do you sign logbooks with?"</p>
          `);
          speakCypher("You are holding an active IRS field transceiver. What username do you sign logbooks with?");
          renderDynamicActionDeck();
          return;
        }

        // Validate Candidate Username
        const sanitized = cleanText.replace(/[^a-zA-Z0-9_\-\s]/g, '').trim().toUpperCase();
        if (sanitized.length < 2 || sanitized.length > 20) {
          printBlock(`<p class="error">Username must be between 2 and 20 characters. Try again.</p>`, "error");
          playSound('BUZZ');
          return;
        }

        pendingUsernameCandidate = sanitized;
        printBlock(`
          <div class="term-title"><span>🏷️ CONFIRM USERNAME</span></div>
          <p>Registering username <strong>'${pendingUsernameCandidate}'</strong> in the corridor ledger.<br>
          Is this correct? (Type <code>YES</code> / <code>NO</code> or tap below)</p>
        `);
        speakCypher(`Registering username ${pendingUsernameCandidate}. Is this correct?`);
        renderDynamicActionDeck();
        return;
      }

      // Rat Lab PIN Challenge
      if (awaitingPinForLab) {
        awaitingPinForLab = false;
        if (cleanText === "8675309") {
          dossier.ratBrainUnlocked = true;
          saveCacherDossier(dossier);
          playSound('CHIME');
          openRatLab();
        } else {
          printBlock(`<div class="term-title"><span>⛔ ACCESS DENIED</span></div><p>Incorrect SysOp PIN.</p>`, "error");
          playSound('BUZZ');
          speakCypher("Access denied. Incorrect PIN.");
        }
        return;
      }

      const splitLine = cleanText.split(" ");
      const verb = splitLine[0].toUpperCase();
      const argument = splitLine.slice(1).join(" ");

      // Rat Lab Internal Commands
      if (inRatLabMode) {
        if (verb === "LAB" || verb === "RATLAB") {
          const subVerb = argument.split(" ")[0].toUpperCase() || "HELP";
          const subArg = argument.split(" ").slice(1).join(" ");
          handleRatLabDirectives(subVerb, subArg, dossier);
          return;
        } else if (verb === "RATBRAIN") {
          executeRatBrainQuery(argument);
          return;
        } else if (verb === "EXIT") {
          exitRatLab();
          return;
        }
      }

      // Standard Trail Command Lookup
      const matchedCommand = TRAIL_ALIAS_INDEX[verb];
      if (matchedCommand) {
        matchedCommand.run(argument, dossier);
      } else {
        playSound('BUZZ');
        printBlock(`<div class="term-block error">Unknown trail command '<strong>${verb}</strong>'. Type <code>HELP</code> for directives.</div>`, "error");
        speakCypher("Unknown trail command.");
      }
    }

    function handleLogSubmit(event) {
      event.preventDefault();
      const input = document.getElementById("cli-input");
      const val = input.value.trim();
      if (!val) return;
      input.value = "";
      executeTrailCommand(val);
      input.focus();
    }

    function checkTrailScans() {
      const urlParams = new URLSearchParams(window.location.search);
      const syncKey = urlParams.get("sync");
      const token = urlParams.get("token") || urlParams.get("clue") || urlParams.get("log") || urlParams.get("restore");

      if (syncKey) {
        restoreDossierFromCloud(syncKey);
      } else if (token) {
        setTimeout(() => {
          printBlock(`<span class="term-dim">[PHYSICAL NFC/QR TAG DETECTED AT GZ CONTAINER]</span>`);
          executeTrailCommand(`LOG ${token}`);
        }, 400);
      }
    }

    // Startup routines
    initOnboardingSequence();
    checkTrailScans();
    adjustForMobileViewport();
  </script>
