<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C.I.P.H.E.R. // Field Terminal Gateway</title>
  <link rel="stylesheet" href="css/terminal.css?v=1.06" />
</head>
<body class="font-md">
  <div class="crt-chassis" id="crtContainer">
    <div class="header-bar">
      <span id="headerStatus">SYSOP RELAY: ONLINE // 56K DIAL-UP</span>
      <div class="header-controls">
        <button class="control-btn" id="fontBtn" onclick="cycleFontSize()">🔠 FONT: MED</button>
        <button class="control-btn" id="audioBtn" onclick="toggleAudio()">🔊 AUDIO: ON</button>
      </div>
    </div>

    <div class="terminal-screen" id="termOutput"></div>

    <div class="action-deck">
      <button class="chip-btn" onclick="triggerAction('SLEUTH')">🔍 SLEUTH</button>
      <button class="chip-btn" onclick="triggerAction('UNLOCK ')">🔑 UNLOCK</button>
      <button class="chip-btn" onclick="triggerAction('FEED ')">💾 FEED TOKEN</button>
      <button class="chip-btn" onclick="triggerAction('STATUS')">📡 STATUS</button>
      <button class="chip-btn" onclick="triggerAction('MAP')">🗺️ MAP</button>
      <button class="chip-btn" onclick="triggerAction('HELP')">❓ HELP</button>
    </div>

    <div class="input-line-wrap">
      <span class="prompt-label">C.I.P.H.E.R.&gt;</span>
      <input 
        type="text" 
        id="cliInput" 
        class="cli-input" 
        autocomplete="off" 
        autocorrect="off" 
        autocapitalize="off" 
        spellcheck="false" 
        autofocus 
      />
    </div>
  </div>

  <script>
    // --- Audio Synthesis Engine (Web Audio API) ---
    let audioContext = null;
    let audioEnabled = true;

    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTone(freq, type = "square", duration = 0.08, delay = 0) {
      if (!audioEnabled) return;
      initAudio();
      setTimeout(() => {
        try {
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioContext.currentTime);
          gain.gain.setValueAtTime(0.04, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioContext.destination);
          osc.start();
          osc.stop(audioContext.currentTime + duration);
        } catch (e) {}
      }, delay * 1000);
    }

    function soundBeep() { playTone(880, "sine", 0.05); }
    function soundKey() { playTone(1200 + Math.random() * 200, "square", 0.015); }
    function soundError() {
      playTone(150, "sawtooth", 0.15, 0);
      playTone(110, "sawtooth", 0.25, 0.15);
    }
    function soundSuccess() {
      playTone(440, "sine", 0.08, 0);
      playTone(554.37, "sine", 0.08, 0.08);
      playTone(659.25, "sine", 0.12, 0.16);
      playTone(880, "sine", 0.25, 0.24);
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById("audioBtn").innerText = audioEnabled ? "🔊 AUDIO: ON" : "🔇 AUDIO: MUTED";
      if (audioEnabled) soundBeep();
    }

    // --- Font Size Controller ---
    const fontSizes = ["sm", "md", "lg"];
    const fontLabels = { sm: "🔠 FONT: SMALL", md: "🔠 FONT: MED", lg: "🔠 FONT: LARGE" };

    function setFontSize(size) {
      if (!fontSizes.includes(size)) size = "md";
      document.body.classList.remove("font-sm", "font-md", "font-lg");
      document.body.classList.add(`font-${size}`);
      localStorage.setItem("cipher_font_size", size);
      const btn = document.getElementById("fontBtn");
      if (btn) btn.innerText = fontLabels[size];
    }

    function cycleFontSize() {
      const current = localStorage.getItem("cipher_font_size") || "md";
      const nextIdx = (fontSizes.indexOf(current) + 1) % fontSizes.length;
      setFontSize(fontSizes[nextIdx]);
      soundBeep();
    }

    // --- State & Scaffolding Engine ---
    const outputEl = document.getElementById("termOutput");
    const inputEl = document.getElementById("cliInput");

    const CONFIG = {
      version: "v1.06-FIELD",
      node01Key: "BLUE-SWITCH",
      certitudeWord: "BLUE-SWITCH-2000",
      validTokens: {
        "TOKEN-PT-01": { name: "Relay Node 01", sector: "Cache Valley Gate" },
        "TOKEN-PT-02": { name: "Relay Node 02", sector: "Corridor Fence Line" },
        "TOKEN-PT-03": { name: "Relay Node 03", sector: "Railway Siding" }
      }
    };

    function getState() {
      return {
        handle: localStorage.getItem("cipher_handle") || "ANONYMOUS_CACHER",
        clearance: parseInt(localStorage.getItem("cipher_clearance") || "0", 10),
        ingested: JSON.parse(localStorage.getItem("cipher_tokens") || "[]")
      };
    }

    function saveState(state) {
      localStorage.setItem("cipher_handle", state.handle);
      localStorage.setItem("cipher_clearance", state.clearance.toString());
      localStorage.setItem("cipher_tokens", JSON.stringify(state.ingested));
    }

    function printBlock(contentHtml, type = "") {
      const card = document.createElement("div");
      card.className = `term-block ${type}`.trim();
      card.innerHTML = contentHtml;
      outputEl.appendChild(card);
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    function printEcho(rawInput) {
      const echo = document.createElement("div");
      echo.className = "user-echo";
      echo.innerText = `C.I.P.H.E.R.> ${rawInput}`;
      outputEl.appendChild(echo);
    }

    function clearScreen() {
      outputEl.innerHTML = "";
    }

    function showBanner() {
      printBlock(`
        <div class="term-title">
          <span>⚡ C.I.P.H.E.R. SYSOP OS ${CONFIG.version}</span>
          <span class="term-dim">LISTENING POST 01</span>
        </div>
        <p>Greetings, traveler. Sensors detect an active GPS receiver in the corridor.</p>
        <p>My memory relays are scrambled across northern Utah. Crack the encrypted dispatch, feed physical tokens from field hides, and I will release the Certitude coordinates.</p>
        <div class="term-dim">
          👉 <strong>Quick Start:</strong> Tap <code>[ 🔍 SLEUTH ]</code> to see your puzzle, or tap <code>[ ❓ HELP ]</code> for all commands.
        </div>
      `);
    }

    function showMap() {
      const state = getState();
      const s1 = state.clearance >= 1 ? "██" : "░░";
      const s2 = state.ingested.includes("TOKEN-PT-01") ? "██" : "░░";
      const s3 = state.ingested.includes("TOKEN-PT-02") ? "██" : "░░";
      const s4 = state.ingested.includes("TOKEN-PT-03") ? "██" : "▒▒";
      const pct = (state.clearance * 20) + (state.ingested.length * 15);

      printBlock(`
        <div class="term-title">
          <span>🗺️ Corridor Sector Restoration Grid</span>
          <span class="term-dim">${pct}% RESTORED</span>
        </div>
        <div class="term-row"><span class="term-label">[01: GATEWAY RELAY]</span><span class="term-val">${s1} ONLINE</span></div>
        <div class="term-row"><span class="term-label">[02: CORRIDOR FENCE]</span><span class="term-val">${s2} ${state.ingested.includes("TOKEN-PT-01") ? "ONLINE" : "DORMANT"}</span></div>
        <div class="term-row"><span class="term-label">[03: RAILWAY SIDING]</span><span class="term-val">${s3} ${state.ingested.includes("TOKEN-PT-02") ? "ONLINE" : "DORMANT"}</span></div>
        <div class="term-row"><span class="term-label">[04: SENTINEL FINAL]</span><span class="term-val">${s4} ${state.ingested.includes("TOKEN-PT-03") ? "ONLINE" : "LOCKED"}</span></div>
        <div class="term-dim" style="margin-top: 4px;">Legend: ██ = Restored & Active | ░░/▒▒ = Corrupted / Offline</div>
      `);
    }

    function showStatus() {
      const state = getState();
      printBlock(`
        <div class="term-title">
          <span>📡 SysOp Telemetry Audit</span>
          <span class="term-dim">PORT 56K</span>
        </div>
        <div class="term-row"><span class="term-label">Active Callsign</span><span class="term-val">${state.handle}</span></div>
        <div class="term-row"><span class="term-label">Clearance Level</span><span class="term-val">Tier ${state.clearance}</span></div>
        <div class="term-row"><span class="term-label">Ingested Tokens</span><span class="term-val">${state.ingested.length} Verified</span></div>
        <div class="term-row"><span class="term-label">Corridor Relay</span><span class="term-val">Listening Post 01</span></div>
        <div class="term-row"><span class="term-label">Connection Carrier</span><span class="term-val">56,600 bps</span></div>
      `);
    }

    function showHelp() {
      printBlock(`
        <div class="term-title">
          <span>❓ SysOp Command Index</span>
          <span class="term-dim">OPERATOR MANUAL</span>
        </div>
        <div class="term-row"><span class="term-val">SLEUTH</span><span class="term-label">Inspect encrypted case dispatch</span></div>
        <div class="term-row"><span class="term-val">UNLOCK &lt;WORD&gt;</span><span class="term-label">Submit decoded passcode for GZ</span></div>
        <div class="term-row"><span class="term-val">FEED &lt;TOKEN&gt;</span><span class="term-label">Feed physical token code from container</span></div>
        <div class="term-row"><span class="term-val">MAP</span><span class="term-label">View corridor sector restoration grid</span></div>
        <div class="term-row"><span class="term-val">STATUS</span><span class="term-label">Check callsign, clearance & baud rate</span></div>
        <div class="term-row"><span class="term-val">FONT &lt;SM/MD/LG&gt;</span><span class="term-label">Adjust screen text size</span></div>
        <div class="term-row"><span class="term-val">HANDLE &lt;NAME&gt;</span><span class="term-label">Register your geocaching callsign</span></div>
        <div class="term-row"><span class="term-val">KICK</span><span class="term-label">Percussive maintenance on casing</span></div>
        <div class="term-row"><span class="term-val">CLEAR</span><span class="term-label">Wipe terminal screen buffer</span></div>
      `);
    }

    function showSleuth() {
      printBlock(`
        <div class="term-title">
          <span>🔍 Intercepted Dispatch // Node 01</span>
          <span class="term-dim">S.O.S. ARCHIVE</span>
        </div>
        <p>Incoming packet intercepted from legacy dial-up relay. Decode the cipher string to extract the clearance passkey:</p>
        <div class="term-callout">
          <div class="term-callout-code">EOXH-VZLWFK</div>
          <div class="term-dim" style="margin-top: 4px;">Cipher Type: Caesar Shift (+3)</div>
        </div>
        <div class="term-dim">
          👉 <strong>Instructions:</strong> Decode using CacheSleuth or your cipher toolbox. Then type <code>UNLOCK &lt;WORD&gt;</code> (or tap the UNLOCK button).
        </div>
      `);
    }

    function processCommand(rawInput) {
      const clean = rawInput.trim();
      if (!clean) return;

      printEcho(clean);
      const parts = clean.split(/\s+/);
      const cmd = parts[0].toUpperCase();
      const arg = parts.slice(1).join(" ").trim();
      const state = getState();

      switch (cmd) {
        case "HELP":
        case "?":
          soundBeep();
          showHelp();
          break;

        case "CLEAR":
        case "CLS":
          clearScreen();
          break;

        case "STATUS":
        case "DIAG":
          soundBeep();
          showStatus();
          break;

        case "MAP":
        case "GRID":
        case "NODES":
          soundBeep();
          showMap();
          break;

        case "FONT":
        case "FONTSIZE":
        case "TEXT":
          if (!arg) {
            cycleFontSize();
            printBlock(`
              <div class="term-title"><span>🔠 Font Size Updated</span></div>
              <p>Current setting: <strong>${(localStorage.getItem("cipher_font_size") || "md").toUpperCase()}</strong></p>
            `);
          } else {
            const target = arg.toLowerCase();
            if (["sm", "small", "1"].includes(target)) setFontSize("sm");
            else if (["lg", "large", "3"].includes(target)) setFontSize("lg");
            else setFontSize("md");
            printBlock(`
              <div class="term-title"><span>🔠 Font Size Updated</span></div>
              <p>Current setting: <strong>${(localStorage.getItem("cipher_font_size") || "md").toUpperCase()}</strong></p>
            `, "success");
          }
          break;

        case "SLEUTH":
        case "CASE":
        case "CLUE":
          soundBeep();
          showSleuth();
          break;

        case "UNLOCK":
        case "AUTH":
        case "CODE":
        case "PASS":
          if (!arg) {
            soundError();
            printBlock(`
              <div class="term-title"><span>⚠️ Missing Passcode</span></div>
              <p>You must provide the decoded secret word!</p>
              <div class="term-dim">Syntax: <code>UNLOCK &lt;WORD&gt;</code></div>
            `, "error");
            return;
          }
          if (arg.toUpperCase() === CONFIG.node01Key) {
            soundSuccess();
            state.clearance = Math.max(state.clearance, 1);
            saveState(state);
            printBlock(`
              <div class="term-title">
                <span>🔓 Access Granted // Level 1 Clearance</span>
                <span class="term-dim">VERIFIED</span>
              </div>
              <p>Relay tumblers disengaged. S.O.S. network coordinates unlocked.</p>
              <div class="term-callout">
                <div style="font-size: 0.9em; margin-bottom: 4px;">CERTITUDE VALIDATION KEYWORD:</div>
                <div class="term-callout-code">${CONFIG.certitudeWord}</div>
              </div>
              <div class="term-dim">
                Enter this keyword into the Certitude checker on the Geocaching listing to get physical GZ and parking coordinates!
              </div>
            `, "success");
          } else {
            soundError();
            printBlock(`
              <div class="term-title"><span>⛔ Passcode Rejected</span></div>
              <p>[BZZZT!] Passcode '${arg}' produced pure radio static.</p>
              <div class="term-dim">Tip: Re-verify your Caesar shift (+3) in CacheSleuth and try again.</div>
            `, "error");
          }
          break;

        case "FEED":
        case "INGEST":
        case "TOKEN":
          if (!arg) {
            soundError();
            printBlock(`
              <div class="term-title"><span>⚠️ Missing Token Code</span></div>
              <p>You must provide the code stamped on the physical container!</p>
              <div class="term-dim">Syntax: <code>FEED &lt;TOKEN-CODE&gt;</code></div>
            `, "error");
            return;
          }
          const tokenUpper = arg.toUpperCase();
          if (CONFIG.validTokens[tokenUpper]) {
            if (state.ingested.includes(tokenUpper)) {
              soundBeep();
              printBlock(`
                <div class="term-title"><span>ℹ️ Token Already Ingested</span></div>
                <p>Token <strong>${tokenUpper}</strong> is already registered to this terminal.</p>
              `, "alert");
            } else {
              soundSuccess();
              state.ingested.push(tokenUpper);
              saveState(state);
              printBlock(`
                <div class="term-title">
                  <span>💾 Token Accepted // Memory Restored</span>
                  <span class="term-dim">${tokenUpper}</span>
                </div>
                <div class="term-row"><span class="term-label">Node Name</span><span class="term-val">${CONFIG.validTokens[tokenUpper].name}</span></div>
                <div class="term-row"><span class="term-label">Sector Restored</span><span class="term-val">${CONFIG.validTokens[tokenUpper].sector}</span></div>
                <p style="margin-top: 6px;">Corridor node marked ONLINE. Tap [ 🗺️ MAP ] to see your updated progress.</p>
              `, "success");
            }
          } else {
            soundError();
            printBlock(`
              <div class="term-title"><span>⛔ Invalid Token</span></div>
              <p>Unrecognized token hash '${arg}'. Verify the stamped alphanumeric string on the physical puck.</p>
            `, "error");
          }
          break;

        case "HANDLE":
        case "NAME":
        case "USER":
          if (!arg) {
            printBlock(`
              <div class="term-title"><span>👤 Active Operator</span></div>
              <p>Current callsign: <strong>${state.handle}</strong></p>
            `);
          } else {
            state.handle = arg.toUpperCase();
            saveState(state);
            soundSuccess();
            printBlock(`
              <div class="term-title"><span>👤 Callsign Registered</span></div>
              <p>Operator identity saved as: <strong>${state.handle}</strong></p>
            `, "success");
          }
          break;

        case "KICK":
        case "HIT":
        case "BANG":
          soundError();
          printBlock(`
            <div class="term-title"><span>🔧 Percussive Maintenance</span></div>
            <p>*THWACK!* You kicked the steel junction box. A spider fell out, the tube flickered, and signal jumped 0.2%. Grandpa engineering at its finest!</p>
          `, "alert");
          break;

        case "COFFEE":
          soundError();
          printBlock(`
            <div class="term-title"><span>☕ Coffee Protocol</span></div>
            <p>ERROR 418: CD drive tray extended. Please do not rest your mug on the tray.</p>
          `, "alert");
          break;

        case "MUGGLE":
          soundBeep();
          printBlock(`
            <div class="term-title"><span>👀 Stealth Alert</span></div>
            <p>Muggle in vicinity! Pretend to tie your hiking boots and look innocent.</p>
          `, "alert");
          break;

        default:
          soundError();
          printBlock(`
            <div class="term-title"><span>❓ Unrecognized Command</span></div>
            <p>Command '${clean}' not found in SysOp index.</p>
            <div class="term-dim">Don't panic! Tap <code>[ ❓ HELP ]</code> to see available actions.</div>
          `, "error");
          break;
      }
    }

    function triggerAction(actionText) {
      if (actionText.endsWith(" ")) {
        inputEl.value = actionText;
        inputEl.focus();
      } else {
        processCommand(actionText);
      }
    }

    // --- Listeners & Initializers ---
    inputEl.addEventListener("keydown", (e) => {
      soundKey();
      if (e.key === "Enter") {
        const val = inputEl.value;
        inputEl.value = "";
        processCommand(val);
      }
    });

    document.getElementById("crtContainer").addEventListener("click", () => {
      inputEl.focus();
    });

    window.addEventListener("DOMContentLoaded", () => {
      setFontSize(localStorage.getItem("cipher_font_size") || "md");
      showBanner();

      const params = new URLSearchParams(window.location.search);
      const urlToken = params.get("token");
      if (urlToken) {
        setTimeout(() => {
          printBlock(`
            <div class="term-title"><span>📡 Field Token Detected</span></div>
            <p>Processing scanned URL parameter: <strong>${urlToken}</strong></p>
          `, "alert");
          processCommand(`FEED ${urlToken}`);
        }, 800);
      }
    });
  </script>
</body>
</html>
