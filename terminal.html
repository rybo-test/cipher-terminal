<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C.I.P.H.E.R. // Field Terminal Gateway</title>
  <style>
    :root {
      --crt-bg: #0b0f10;
      --crt-text: #00ff66;
      --crt-dim: #008833;
      --crt-alert: #ffb000;
      --crt-error: #ff3333;
      --crt-glow: rgba(0, 255, 102, 0.4);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #050708;
      color: var(--crt-text);
      font-family: "Courier New", Courier, monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    .crt-chassis {
      width: 100%;
      max-width: 860px;
      background-color: var(--crt-bg);
      border: 3px solid var(--crt-text);
      border-radius: 12px;
      box-shadow: 0 0 25px var(--crt-glow), inset 0 0 15px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 92vh;
    }
    .crt-chassis::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
    }
    .header-bar {
      padding: 10px 16px;
      background-color: #08140e;
      border-bottom: 2px solid var(--crt-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: bold;
      z-index: 12;
    }
    .audio-toggle {
      background: transparent;
      border: 1px solid var(--crt-text);
      color: var(--crt-text);
      padding: 4px 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      border-radius: 4px;
    }
    .audio-toggle:hover {
      background: var(--crt-dim);
      color: #fff;
    }
    .terminal-screen {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.5;
      text-shadow: 0 0 4px var(--crt-glow);
      user-select: text;
      z-index: 11;
    }
    .terminal-screen pre {
      font-family: inherit;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .action-deck {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 14px;
      background-color: #07100b;
      border-top: 1px dashed var(--crt-dim);
      z-index: 12;
    }
    .chip-btn {
      background: #0d1a12;
      border: 1px solid var(--crt-text);
      color: var(--crt-text);
      padding: 8px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 0 5px rgba(0, 255, 102, 0.15);
      transition: all 0.1s ease;
    }
    .chip-btn:active {
      background: var(--crt-text);
      color: var(--crt-bg);
      transform: translateY(1px);
    }
    .input-line-wrap {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      background-color: #040906;
      border-top: 2px solid var(--crt-text);
      z-index: 12;
    }
    .prompt-label {
      font-weight: bold;
      margin-right: 8px;
      color: var(--crt-text);
    }
    .cli-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--crt-text);
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      text-shadow: 0 0 4px var(--crt-glow);
    }
    .glitch-text { color: var(--crt-alert); }
    .success-text { color: #55ff55; font-weight: bold; }
    .error-text { color: var(--crt-error); }
  </style>
</head>
<body>
  <div class="crt-chassis" id="crtContainer">
    <div class="header-bar">
      <span id="headerStatus">SYSOP RELAY: ONLINE // 56K DIAL-UP</span>
      <button class="audio-toggle" id="audioBtn" onclick="toggleAudio()">🔊 AUDIO: ON</button>
    </div>

    <div class="terminal-screen" id="termOutput"></div>

    <div class="action-deck">
      <button class="chip-btn" onclick="triggerAction('SLEUTH')">🔍 SLEUTH</button>
      <button class="chip-btn" onclick="triggerAction('UNLOCK ')">🔑 UNLOCK</button>
      <button class="chip-btn" onclick="triggerAction('FEED ')">💾 FEED TOKEN</button>
      <button class="chip-btn" onclick="triggerAction('STATUS')">📡 STATUS</button>
      <button class="chip-btn" onclick="triggerAction('MAP')">🗺️ MAP</button>
      <button class="chip-btn" onclick="triggerAction('HELP')">❓ HELP</button>
    </div>

    <div class="input-line-wrap">
      <span class="prompt-label">C.I.P.H.E.R.&gt;</span>
      <input type="text" id="cliInput" class="cli-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus />
    </div>
  </div>

  <script>
    // Audio Synthesis Engine (Web Audio API)
    let audioContext = null;
    let audioEnabled = true;

    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTone(freq, type = "square", duration = 0.08, delay = 0) {
      if (!audioEnabled) return;
      initAudio();
      setTimeout(() => {
        try {
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioContext.currentTime);
          gain.gain.setValueAtTime(0.04, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioContext.destination);
          osc.start();
          osc.stop(audioContext.currentTime + duration);
        } catch (e) {}
      }, delay * 1000);
    }

    function soundBeep() { playTone(880, "sine", 0.05); }
    function soundKey() { playTone(1200 + Math.random() * 200, "square", 0.015); }
    function soundError() {
      playTone(150, "sawtooth", 0.15, 0);
      playTone(110, "sawtooth", 0.25, 0.15);
    }
    function soundSuccess() {
      playTone(440, "sine", 0.08, 0);
      playTone(554.37, "sine", 0.08, 0.08);
      playTone(659.25, "sine", 0.12, 0.16);
      playTone(880, "sine", 0.25, 0.24);
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('audioBtn').innerText = audioEnabled ? "🔊 AUDIO: ON" : "🔇 AUDIO: MUTED";
      if (audioEnabled) soundBeep();
    }

    // Terminal State & Engine Logic
    const outputEl = document.getElementById("termOutput");
    const inputEl = document.getElementById("cliInput");

    const CONFIG = {
      version: "v1.04-FIELD",
      node01Key: "BLUE-SWITCH",
      certitudeWord: "BLUE-SWITCH-2000",
      validTokens: {
        "TOKEN-PT-01": { name: "Relay Node 01", sector: "Cache Valley Gate" },
        "TOKEN-PT-02": { name: "Relay Node 02", sector: "Corridor Fence Line" },
        "TOKEN-PT-03": { name: "Relay Node 03", sector: "Railway Siding" }
      }
    };

    function getState() {
      return {
        handle: localStorage.getItem("cipher_handle") || "ANONYMOUS_CACHER",
        clearance: parseInt(localStorage.getItem("cipher_clearance") || "0", 10),
        ingested: JSON.parse(localStorage.getItem("cipher_tokens") || "[]")
      };
    }

    function saveState(state) {
      localStorage.setItem("cipher_handle", state.handle);
      localStorage.setItem("cipher_clearance", state.clearance.toString());
      localStorage.setItem("cipher_tokens", JSON.stringify(state.ingested));
    }

    function print(text, className = "") {
      const p = document.createElement("p");
      if (className) p.className = className;
      p.innerHTML = text;
      outputEl.appendChild(p);
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    function clearScreen() {
      outputEl.innerHTML = "";
    }

    function showBanner() {
      print(`
  ___   ___  ____   __  __  ____  ____ 
 / __) (_  )(  _ \\ (  )(  )(  __)(  _ \\
( (__   / /  ) __/  )(__)(  ) _)  )   /
 \\___) (___)(__)   (______)(____)(__\\_)
============================================================
C.I.P.H.E.R. SYSOP OS ${CONFIG.version} // CORRIDOR LISTENING POST 01
CURRENT STATUS: WAKING UP FROM A 25-YEAR NAP
============================================================
Greetings, traveler. My memory sectors are scrambled across 
northern Utah. Decrypt my relays, feed me token keys from the 
field, and I'll unlock Certitude coordinates for you.

Tap any green button below or type a command to begin.
------------------------------------------------------------`);
    }

    function showMap() {
      const state = getState();
      const s1 = state.clearance >= 1 ? "██" : "░░";
      const s2 = state.ingested.includes("TOKEN-PT-01") ? "██" : "░░";
      const s3 = state.ingested.includes("TOKEN-PT-02") ? "██" : "░░";
      const s4 = state.ingested.includes("TOKEN-PT-03") ? "██" : "▒▒";

      print(`
[CORRIDOR MEMORY SECTOR RESTORATION GRID]
+------------------------------------+
|  [01: GATEWAY]  ${s1}  |  [02: RELAY]    ${s2}  |
|  [03: SIDING]   ${s3}  |  [04: FENCE]    ${s4}  |
+------------------------------------+
(██ = ONLINE & RESTORED | ░░/▒▒ = CORRUPTED / DORMANT)
Effective Memory Restored: ${(state.clearance * 20) + (state.ingested.length * 15)}%`);
    }

    function showStatus() {
      const state = getState();
      print(`
SYSOP TELEMETRY REPORT:
- Active Callsign   : ${state.handle}
- Security Clearance: Level ${state.clearance}
- Ingested Tokens   : ${state.ingested.length} verified
- Corridor Node     : Node 01 (Dormant Relay)
- Dial-Up Baud Rate : 56,600 bps (Optimal)`);
    }

    function showHelp() {
      print(`
FRIENDLY COMMAND DIRECTORY:
* SLEUTH        - View today's encrypted case dispatch
* UNLOCK <WORD> - Submit decrypted passcode to unlock GZ
* FEED <TOKEN>  - Feed a physical token code found in a cache
* STATUS        - Show active callsign and memory restoration
* MAP           - Display corridor sector restoration grid
* HANDLE <NAME> - Register your geocaching player name
* KICK          - Apply percussive maintenance to rusty casing
* CLEAR         - Clear terminal screen buffer`);
    }

    function processCommand(rawInput) {
      const clean = rawInput.trim();
      if (!clean) return;

      print(`&gt; ${clean}`, "prompt-label");
      const parts = clean.split(/\s+/);
      const cmd = parts[0].toUpperCase();
      const arg = parts.slice(1).join(" ").trim();
      const state = getState();

      switch (cmd) {
        case "HELP":
        case "?":
          soundBeep();
          showHelp();
          break;

        case "CLEAR":
        case "CLS":
          clearScreen();
          break;

        case "STATUS":
        case "DIAG":
          soundBeep();
          showStatus();
          break;

        case "MAP":
        case "GRID":
        case "NODES":
          soundBeep();
          showMap();
          break;

        case "SLEUTH":
        case "CASE":
        case "CLUE":
          soundBeep();
          print(`
[INCOMING DISPATCH // S.O.S. ARCHIVE NODE-01]
INTERCEPTED CIPHER STRING:
============================================================
  "EOXH-VZLWFK"  (Caesar Cipher Shift: +3)
============================================================
DIRECTIONS:
1. Decode the string above using CacheSleuth or your favorite cipher tool.
2. Type UNLOCK &lt;DECODED_WORD&gt; to authenticate and unlock Certitude.`);
          break;

        case "UNLOCK":
        case "AUTH":
        case "CODE":
        case "PASS":
          if (!arg) {
            soundError();
            print("ERROR: Missing passcode! Type: UNLOCK <WORD>", "error-text");
            return;
          }
          if (arg.toUpperCase() === CONFIG.node01Key) {
            soundSuccess();
            state.clearance = Math.max(state.clearance, 1);
            saveState(state);
            print(`
[SUCCESS] Passcode confirmed! Relays aligned!
============================================================
CERTITUDE KEYWORD: ${CONFIG.certitudeWord}
============================================================
Enter this keyword into the Certitude checker on Geocaching.com 
to retrieve physical coordinates and field parking!`, "success-text");
          } else {
            soundError();
            print(`[BZZZT!] Passcode '${arg}' rejected! Radio static detected. Re-check your cipher shift at CacheSleuth.`, "error-text");
          }
          break;

        case "FEED":
        case "INGEST":
        case "TOKEN":
          if (!arg) {
            soundError();
            print("ERROR: Missing token! Type: FEED <TOKEN-CODE>", "error-text");
            return;
          }
          const tokenUpper = arg.toUpperCase();
          if (CONFIG.validTokens[tokenUpper]) {
            if (state.ingested.includes(tokenUpper)) {
              soundBeep();
              print(`NOTICE: Token ${tokenUpper} was already fed into this terminal!`, "glitch-text");
            } else {
              soundSuccess();
              state.ingested.push(tokenUpper);
              saveState(state);
              print(`
[DING!] Valid token ingested: ${CONFIG.validTokens[tokenUpper].name}
Sector [${CONFIG.validTokens[tokenUpper].sector}] marked ONLINE!
Memory restoration escalated.`, "success-text");
            }
          } else {
            soundError();
            print(`[ERROR] Unrecognized token '${arg}'. Check the stamp on the physical puck.`, "error-text");
          }
          break;

        case "HANDLE":
        case "NAME":
        case "USER":
          if (!arg) {
            print(`Current callsign: ${state.handle}`);
          } else {
            state.handle = arg.toUpperCase();
            saveState(state);
            soundSuccess();
            print(`Callsign updated to: ${state.handle}`, "success-text");
          }
          break;

        case "KICK":
        case "HIT":
        case "BANG":
          soundError();
          print("*THWACK!* You kicked the steel junction box. A spider fell out, the tube flickered, and signal jumped 0.2%. Grandpa engineering at its finest!", "glitch-text");
          break;

        case "COFFEE":
          soundError();
          print("ERROR 418: CD drive tray extended. Please do not rest your mug on the tray.", "glitch-text");
          break;

        case "MUGGLE":
          soundBeep();
          print("STEALTH WARNING: Muggle spotted! Pretend to tie your hiking boots and look casual!", "glitch-text");
          break;

        default:
          soundError();
          print(`UNKNOWN COMMAND: '${clean}'. Don't panic! Tap [ ❓ HELP ] to see what to do.`, "error-text");
          break;
      }
    }

    function triggerAction(actionText) {
      if (actionText.endsWith(" ")) {
        inputEl.value = actionText;
        inputEl.focus();
      } else {
        processCommand(actionText);
      }
    }

    // Event Listeners & URL Token Auto-Ingest
    inputEl.addEventListener("keydown", (e) => {
      soundKey();
      if (e.key === "Enter") {
        const val = inputEl.value;
        inputEl.value = "";
        processCommand(val);
      }
    });

    document.getElementById("crtContainer").addEventListener("click", () => {
      inputEl.focus();
    });

    window.addEventListener("DOMContentLoaded", () => {
      showBanner();
      // Handle direct NFC or QR scan: ?token=TOKEN-PT-01
      const params = new URLSearchParams(window.location.search);
      const urlToken = params.get("token");
      if (urlToken) {
        setTimeout(() => {
          print(`[AUTOPUBLISH] NFC/QR Field Scan detected: ${urlToken}`, "glitch-text");
          processCommand(`FEED ${urlToken}`);
        }, 800);
      }
    });
  </script>
</body>
</html>
