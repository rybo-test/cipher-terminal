<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C.I.P.H.E.R. // Field Terminal</title>
  <style>
    :root {
      --bg-color: #0b0f10;
      --term-green: #00ff66;
      --term-dim: #008833;
      --term-error: #ff3333;
      --term-admin: #ffaa00;
      --font-size-default: 16px;
      --input-size-default: 17px;
    }

    body {
      background-color: var(--bg-color);
      color: var(--term-green);
      font-family: 'Courier New', Courier, monospace;
      font-size: var(--font-size-default);
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
    }

    #header-bar {
      border-bottom: 1px dashed var(--term-dim);
      padding-bottom: 8px;
      margin-bottom: 10px;
      font-size: 0.9em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #terminal-screen {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 5px;
      scroll-behavior: smooth;
    }

    .term-block {
      border-left: 3px solid var(--term-green);
      padding-left: 10px;
      margin-bottom: 4px;
    }

    .term-block.error { border-left-color: var(--term-error); color: var(--term-error); }
    .term-block.admin { border-left-color: var(--term-admin); color: var(--term-admin); }

    .term-title {
      font-weight: bold;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .term-dim {
      color: var(--term-dim);
      font-size: 0.85em;
    }

    #action-deck {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin: 10px 0;
    }

    .action-chip {
      background: rgba(0, 255, 102, 0.1);
      border: 1px solid var(--term-dim);
      color: var(--term-green);
      padding: 8px 4px;
      font-family: inherit;
      font-size: 0.8em;
      text-align: center;
      cursor: pointer;
      border-radius: 3px;
      text-transform: uppercase;
    }
    .action-chip:active {
      background: var(--term-green);
      color: var(--bg-color);
    }

    #input-form {
      display: flex;
      gap: 8px;
      border-top: 1px dashed var(--term-dim);
      padding-top: 10px;
    }

    #prompt-symbol {
      color: var(--term-green);
      font-weight: bold;
      align-self: center;
    }

    #cli-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--term-green);
      font-family: 'Courier New', Courier, monospace;
      font-size: var(--input-size-default);
      outline: none;
    }
  </style>
</head>
<body>

  <div id="header-bar">
    <span id="sys-status">SYSOP RELAY: CONNECTING...</span>
    <span id="sys-handle">CALLSIGN: UNKNOWN</span>
  </div>

  <div id="terminal-screen">
    <div class="term-block">
      <div class="term-title"><span>C.I.P.H.E.R. // CORE BOOT v1.21</span></div>
      <p>ESTABLISHING CARRIER... OK.<br>MEMORY INTEGRITY: 3.1% (DEGRADED).<br>Type <code>HELP</code> for available directives, or use the field action chips below.</p>
    </div>
  </div>

  <div id="action-deck">
    <button class="action-chip" onclick="runCommand('SLEUTH')">[ 🔍 SLEUTH ]</button>
    <button class="action-chip" onclick="runCommand('STATUS')">[ 📊 STATUS ]</button>
    <button class="action-chip" onclick="runCommand('TRAIN')">[ 🎓 TRAIN ]</button>
  </div>

  <form id="input-form" onsubmit="handleFormSubmit(event)">
    <span id="prompt-symbol">&gt;</span>
    <input type="text" id="cli-input" autocomplete="off" autofocus placeholder="Enter directive...">
  </form>

  <script>
    // PASTE YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL HERE:
    const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbzy_nVH9dNt12aTMkG7SK8SiX_3yv9I2S_JAt_QgaroaEvyaSoIR1fIkKVH__lxag7a/exec";

    let awaitingAdminPin = false;
    
    function getState() {
      return {
        handle: localStorage.getItem("cipher_handle") || "ANONYMOUS",
        tokensIngested: Number(localStorage.getItem("cipher_tokens") || 0)
      };
    }

    function setHandle(newHandle) {
      localStorage.setItem("cipher_handle", newHandle.toUpperCase());
      updateHeader();
    }

    function updateHeader() {
      const state = getState();
      document.getElementById("sys-handle").innerText = `CALLSIGN: ${state.handle}`;
    }

    function printBlock(htmlContent, type = "") {
      const screen = document.getElementById("terminal-screen");
      const block = document.createElement("div");
      block.className = `term-block ${type}`;
      block.innerHTML = htmlContent;
      screen.appendChild(block);
      screen.scrollTop = screen.scrollHeight;
    }

    async function sendTelemetry(action, payload) {
      if (!GAS_ENDPOINT) return;
      try {
        const data = Object.assign({ action: action, callsign: getState().handle, clientVersion: "v1.21" }, payload);
        await fetch(GAS_ENDPOINT, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } catch (err) {
        console.error("Telemetry error:", err);
      }
    }

    async function verifyAdminPin(pin) {
      if (!GAS_ENDPOINT) return pin === "8675309"; // local fallback
      try {
        const response = await fetch(GAS_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: "VERIFY_PIN", pin: pin })
        });
        const result = await response.json();
        return result.success;
      } catch (err) {
        console.error("PIN verification error:", err);
        return false;
      }
    }

    async function handleAdminCommand(arg) {
      const state = getState();
      if (state.handle !== "NEZZMUK" && !state.handle.includes("RATPACK")) {
        printBlock(`
          <div class="term-title"><span>⛔ ACCESS DENIED</span></div>
          <p>Operator callsign '<strong>${state.handle}</strong>' lacks administrative clearance.</p>
          <div class="term-dim">Rat Pack or authorized SysOp credentials required.</div>
        `, "error");
        awaitingAdminPin = false;
        return;
      }

      if (arg) {
        awaitingAdminPin = false;
        const isValid = await verifyAdminPin(arg);
        if (isValid) {
          printBlock(`<div class="term-title"><span>⚡ SYSOP ROOT GRANTED</span></div><p>Welcome back, commander. Root privileges active.</p>`, "admin");
        } else {
          printBlock(`<div class="term-title"><span>⛔ PIN REJECTED</span></div><p>Invalid 7-digit SysOp PIN.</p>`, "error");
        }
        return;
      }

      if (awaitingAdminPin) {
        const pinInput = document.getElementById("cli-input").value;
        awaitingAdminPin = false;
        const isValid = await verifyAdminPin(pinInput);
        if (isValid) {
          printBlock(`<div class="term-title"><span>⚡ SYSOP ROOT GRANTED</span></div><p>Welcome back, commander. Root privileges active.</p>`, "admin");
        } else {
          printBlock(`<div class="term-title"><span>⛔ PIN REJECTED</span></div><p>Authentication challenge failed.</p>`, "error");
        }
        return;
      }

      awaitingAdminPin = true;
      printBlock(`
        <div class="term-title"><span>🔐 S.O.S. ROOT CHALLENGE</span></div>
        <p>Enter your <strong>7-digit SysOp Admin PIN</strong> below:</p>
      `, "admin");
    }

    async function runCommand(cmdText) {
      const parts = cmdText.trim().split(" ");
      const verb = parts[0].toUpperCase();
      const arg = parts.slice(1).join(" ");

      printBlock(`<span class="term-dim">&gt; ${cmdText}</span>`);

      if (awaitingAdminPin) {
        handleAdminCommand(cmdText);
        return;
      }

      switch (verb) {
        case "HELP":
          printBlock(`
            <div class="term-title"><span>📖 DIRECTIVES DIRECTORY</span></div>
            <p><strong>HANDLE &lt;name&gt;</strong> - Set your geocaching callsign<br>
            <strong>FEED &lt;token&gt;</strong> - Ingest a field token (e.g. FEED TOKEN-PT-01)<br>
            <strong>ADMIN</strong> - Request root access (Rat Pack only)<br>
            <strong>STATUS</strong> - Display system metrics<br>
            <strong>CLEAR</strong> - Clear terminal buffer</p>
          `);
          break;

        case "HANDLE":
          if (arg) {
            setHandle(arg);
            printBlock(`<p>Operator callsign updated to: <strong>${getState().handle}</strong></p>`);
            sendTelemetry("LOG_EVENT", { eventId: "HANDLE_SET" });
          } else {
            printBlock(`<p>Active Operator: <strong>${getState().handle}</strong></p>`);
          }
          break;

        case "FEED":
          const tokenId = arg || "TOKEN-UNKNOWN";
          printBlock(`
            <div class="term-title"><span>💾 INGESTING TOKEN...</span></div>
            <p>Token ID: <strong>${tokenId}</strong> processed successfully.<br>Parity synchronized with corridor ledger.</p>
          `);
          sendTelemetry("INGEST_TOKEN", { tokenId: tokenId });
          break;

        case "ADMIN":
          handleAdminCommand(arg);
          break;

        case "STATUS":
          printBlock(`
            <div class="term-title"><span>📊 SYSTEM METRICS</span></div>
            <p>Operator: ${getState().handle}<br>Memory Integrity: 3.1%<br>Relay Nodes: Online</p>
          `);
          break;

        case "CLEAR":
          document.getElementById("terminal-screen").innerHTML = "";
          break;

        default:
          printBlock(`<div class="error">Unknown directive '<strong>${verb}</strong>'. Type <code>HELP</code> for options.</div>`, "error");
          break;
      }
    }

    function handleFormSubmit(event) {
      event.preventDefault();
      const input = document.getElementById("cli-input");
      const val = input.value.trim();
      if (!val) return;
      input.value = "";
      runCommand(val);
    }

    // Initialize UI state on boot
    updateHeader();
    if (GAS_ENDPOINT && GAS_ENDPOINT.includes("exec")) {
      document.getElementById("sys-status").innerText = "SYSOP RELAY: ONLINE // 56K";
    } else {
      document.getElementById("sys-status").innerText = "SYSOP RELAY: ONLINE (LOCAL)";
    }
  </script>
</body>
</html>
