<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>C.I.P.H.E.R. // Terminal Node 01</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0b0f10;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    #terminal-container {
      width: 100%;
      max-width: 820px;
      background: #0d1215;
      border: 2px solid #00ff66;
      border-radius: 6px;
      box-shadow: 0 0 16px rgba(0, 255, 102, 0.25);
      display: flex;
      flex-direction: column;
      height: 94vh;
      overflow: hidden;
    }
    #screen {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.45;
    }
    #input-bar {
      display: flex;
      align-items: center;
      border-top: 1px solid #00ff66;
      background: #080c0d;
      padding: 8px 12px;
    }
    .prompt-label {
      color: #00ff66;
      font-weight: bold;
      margin-right: 8px;
      user-select: none;
    }
    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #00ff66;
      font-family: inherit;
      font-size: 15px;
    }
    a { color: #58a6ff; text-decoration: underline; }
    .highlight { color: #ffffff; font-weight: bold; }
    .badge-box {
      border: 1px dashed #00ff66;
      padding: 8px;
      margin: 6px 0;
      background: #05160c;
    }
    .err-text { color: #ff5555; }
    .banner {
      color: #00ff66;
      font-size: 10px;
      line-height: 1.1;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div id="terminal-container" onclick="focusInput()">
  <div id="screen"></div>
  <div id="input-bar">
    <span class="prompt-label">C.I.P.H.E.R.&gt;</span>
    <input 
      type="text" 
      id="cmd-input" 
      autocomplete="off" 
      autocorrect="off" 
      autocapitalize="none" 
      spellcheck="false" 
      placeholder="Type help, sleuth, or test all..."
    />
  </div>
</div>

<script>
  // --- STATE & CONFIG ---
  const CONFIG = {
    version: "v1.05-sleuth",
    toolsUrl: "https://www.cachesleuth.com/",
    validPasskeys: ["AUTH-SIGNAL-702", "PASSKEY-SLEUTH-42"],
    certitudeKeyword: "BLUE-SWITCH-2000",
    certitudeUrl: "https://www.certitude.org/"
  };

  const screenEl = document.getElementById("screen");
  const inputEl = document.getElementById("cmd-input");
  let audioCtx = null;

  // --- AUDIO SYNTHESIS (Android / Mobile Compatible) ---
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  function playTone(freq, type = "sine", duration = 0.1, stopRamp = true) {
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      if (stopRamp) {
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      }
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {
      console.warn("Audio bypass:", e);
    }
  }

  function playSuccessSweep() {
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
      osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.45);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.45);
    } catch (e) {}
  }

  function playErrorBuzz() {
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(140, audioCtx.currentTime);
      osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    } catch (e) {}
  }

  // --- OUTPUT UTILITIES ---
  function print(htmlText, playClick = true) {
    const p = document.createElement("div");
    p.innerHTML = htmlText;
    screenEl.appendChild(p);
    screenEl.scrollTop = screenEl.scrollHeight;
    if (playClick) playTone(950, "sine", 0.03);
  }

  function focusInput() {
    initAudio();
    inputEl.focus();
  }

  // --- COMMAND PROCESSOR ---
  async function processCommand(raw) {
    const input = raw.trim();
    if (!input) return;

    print(`<span style="color:#58a6ff;">&gt; ${escapeHtml(input)}</span>`, false);

    const parts = input.split(/\s+/);
    const cmd = parts[0].toLowerCase();
    const arg = parts.slice(1).join(" ").trim();

    switch (cmd) {
      case "help":
        print(`
AVAILABLE OPERATIONAL COMMANDS:
  <span class="highlight">help</span>               Display system commands
  <span class="highlight">status</span>             Display current clearance & telemetry
  <span class="highlight">sleuth</span>             Intercept encrypted cipher payload
  <span class="highlight">auth &lt;PASSKEY&gt;</span>     Submit decoded authorization passkey
  <span class="highlight">ingest &lt;TOKEN&gt;</span>    Ingest physical field token hash
  <span class="highlight">test all</span>           Run self-contained diagnostic suite
  <span class="highlight">clear</span>              Clear terminal buffer
  <span class="highlight">reboot</span>             Reset local session state`);
        break;

      case "status":
        const lvl = localStorage.getItem("cipher_clearance_level") || "0";
        const unlocked = localStorage.getItem("cipher_node01_unlocked") === "true";
        print(`
OPERATOR TELEMETRY STATUS:
  Clearance Level:    ${lvl}
  Active Node:        NODE-01 (Safe Mode)
  Authentication:     ${unlocked ? "VERIFIED" : "PENDING"}
  Target Network:     S.O.S. Corridor Relay`);
        break;

      case "sleuth":
      case "investigate":
      case "case":
        playTone(700, "sine", 0.08);
        setTimeout(() => playTone(1200, "sine", 0.12), 90);
        print(`
============================================================
[RELAY NODE 01: INTERCEPTED CIPHER TRANSMISSION]
============================================================
SYSOP INTERCEPT: S.O.S. LEGACY BEACON FREQUENCY 146.520 MHz
ENCRYPTION TYPE: CORRIDOR CAESAR SHIFT (EPOCH OFFSET: -6)

RAW TELEMETRY PAYLOAD:
<div style="background:#05160c; border:1px dashed #00ff66; padding:8px; margin:6px 0; font-size:16px; letter-spacing:2px; color:#fff; text-align:center;">
  NKXJ-YOMTGR-702
</div>

INSTRUCTIONS:
1. Decode this payload using <a href="${CONFIG.toolsUrl}" target="_blank" rel="noopener noreferrer">CacheSleuth</a> or any cipher toolkit.
2. Submit the decoded plaintext using: <span class="highlight">auth &lt;DECODED_KEY&gt;</span>
============================================================`);
        break;

      case "auth":
      case "unlock":
        if (!arg) {
          playErrorBuzz();
          print(`<span class="err-text">[!] SYNTAX ERROR: Usage: auth &lt;PASSKEY&gt;</span>`);
          return;
        }
        if (CONFIG.validPasskeys.includes(arg.toUpperCase())) {
          localStorage.setItem("cipher_clearance_level", "1");
          localStorage.setItem("cipher_node01_unlocked", "true");
          playSuccessSweep();
          print(`
============================================================
[+] HANDSHAKE VERIFIED: PASSKEY ACCEPTED
============================================================
SECURITY STATUS: ELEVATED TO CLEARANCE LEVEL 1
ACHIEVEMENT: [S.O.S. TIER 1 CITATION UNLOCKED]

[CERTITUDE COORDINATE KEYWORD]:
<div class="badge-box">
  KEYWORD: <span style="font-size:15px; color:#fff; background:#1f6feb; padding:2px 6px;">${CONFIG.certitudeKeyword}</span>
</div>

Validate keyword on the listing's Certitude checker:
<a href="${CONFIG.certitudeUrl}" target="_blank" rel="noopener noreferrer">[OPEN CERTITUDE VALIDATOR]</a>

Next Step: Retrieve physical container at GZ and scan/enter token:
<span class="highlight">ingest &lt;TOKEN-ID&gt;</span>
============================================================`, false);
        } else {
          playErrorBuzz();
          print(`<span class="err-text">[!] REJECTION: Checksum parity error for '${escapeHtml(arg)}'. Check your cipher decode.</span>`);
        }
        break;

      case "ingest":
        if (!arg) {
          playErrorBuzz();
          print(`<span class="err-text">[!] Missing Token ID. Usage: ingest &lt;TOKEN-ID&gt;</span>`);
          return;
        }
        if (arg.toUpperCase() === "TOKEN-PT-01" || arg.toUpperCase() === "TOKEN-RLY-702") {
          playSuccessSweep();
          print(`[+] INGESTION CONFIRMED: Token ${escapeHtml(arg.toUpperCase())} accepted. Memory sector committed.`);
        } else {
          playErrorBuzz();
          print(`<span class="err-text">[!] UNRECOGNIZED TOKEN: Hash does not match local sector manifest.</span>`);
        }
        break;

      case "test":
        if (arg.toLowerCase() === "all") {
          await runDiagnosticSuite();
        } else {
          print(`Run <span class="highlight">test all</span> to execute diagnostics.`);
        }
        break;

      case "clear":
        screenEl.innerHTML = "";
        break;

      case "reboot":
        localStorage.clear();
        print(`[*] System rebooted. Local storage cleared.`);
        setTimeout(initTerminal, 600);
        break;

      default:
        playErrorBuzz();
        print(`<span class="err-text">Unknown command '${escapeHtml(cmd)}'. Type 'help' for valid directives.</span>`);
    }
  }

  // --- DIAGNOSTIC REGRESSION RUNNER ---
  async function runDiagnosticSuite() {
    print(`\n--- RUNNING DIAGNOSTIC TEST HARNESS ---`);
    
    // 1. Audio check
    print(`[1/4] Verifying Audio Engine...`);
    playTone(600, "sine", 0.08);
    await sleep(150);
    playTone(900, "triangle", 0.08);
    await sleep(150);
    print(`      -> Web Audio oscillator pipeline active.`);

    // 2. Telemetry JSON check
    print(`[2/4] Testing telemetry fetch (cache-busting)...`);
    try {
      const res = await fetch(`telemetry.json?t=${Date.now()}`, { cache: "no-store" });
      if (res.ok) {
        const json = await res.json();
        print(`      -> telemetry.json reachable (Stage: ${json.system_state.community_sentience_stage || 1})`);
      } else {
        print(`      -> <span class="err-text">HTTP ${res.status}: telemetry.json fetch non-200.</span>`);
      }
    } catch (e) {
      print(`      -> <span class="err-text">telemetry.json offline/unreachable: ${e.message}</span>`);
    }

    // 3. Auth Engine Simulation
    print(`[3/4] Validating Passkey & Clearance Gating...`);
    const mockKey = CONFIG.validPasskeys[0];
    if (CONFIG.validPasskeys.includes(mockKey)) {
      localStorage.setItem("cipher_clearance_level", "1");
      print(`      -> Passkey regex and localStorage level-up verified.`);
    } else {
      print(`      -> <span class="err-text">Passkey verification failed.</span>`);
    }

    // 4. Persistence Check
    print(`[4/4] Validating local persistence...`);
    if (localStorage.getItem("cipher_clearance_level") === "1") {
      print(`      -> State persistence verified.`);
    } else {
      print(`      -> <span class="err-text">Storage write failed.</span>`);
    }

    print(`\n[✔] TEST ALL COMPLETE: Core terminal vectors verified.\n`);
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // --- COLD BOOT INIT ---
  function initTerminal() {
    screenEl.innerHTML = "";
    const banner = `
  ___   ___  ____   __  __  ____  ____ 
 / __) (_  )(  _ \\ (  )(  )(  __)(  _ \\
( (__   / /  ) __/  )(__)(  ) _)  )   /
 \\___) (___)(__)   (______)(____)(__\\_)
 C.I.P.H.E.R. SYSOP // TERMINAL NODE 01
 SYS VERSION: ${CONFIG.version} // CORRIDOR RELAY
=================================================`;
    print(`<div class="banner">${banner}</div>`, false);
    print(`[SYSTEM ONLINE]: Cold boot completed.`);
    print(`Tap screen, then type <span class="highlight">sleuth</span> to inspect cipher or <span class="highlight">help</span> for commands.\n`, false);
  }

  // Key listener for mobile soft keyboard Enter
  inputEl.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      const val = inputEl.value;
      inputEl.value = "";
      processCommand(val);
    }
  });

  window.addEventListener("load", initTerminal);
</script>
</body>
</html>
