<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>C.I.P.H.E.R. // Maintenance Shell v1.04-SOS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0b0f10;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    #terminal-container {
      width: 100%;
      max-width: 820px;
      background: #0d1215;
      border: 2px solid #00ff66;
      border-radius: 6px;
      box-shadow: 0 0 16px rgba(0, 255, 102, 0.25);
      display: flex;
      flex-direction: column;
      height: 94vh;
      overflow: hidden;
    }
    #screen {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.45;
    }
    #input-bar {
      display: flex;
      align-items: center;
      border-top: 1px solid #00ff66;
      background: #080c0d;
      padding: 8px 12px;
    }
    .prompt-label {
      color: #00ff66;
      font-weight: bold;
      margin-right: 8px;
      user-select: none;
    }
    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #00ff66;
      font-family: inherit;
      font-size: 15px;
    }
    a { color: #58a6ff; text-decoration: underline; }
    .highlight { color: #ffffff; font-weight: bold; }
    .badge-box {
      border: 1px dashed #00ff66;
      padding: 8px;
      margin: 6px 0;
      background: #05160c;
    }
    .err-text { color: #ff5555; }
    .warn-text { color: #ffcc00; }
    .banner {
      color: #00ff66;
      font-size: 10px;
      line-height: 1.1;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div id="terminal-container" onclick="focusInput()">
  <div id="screen"></div>
  <div id="input-bar">
    <span class="prompt-label">C.I.P.H.E.R.&gt;</span>
    <input 
      type="text" 
      id="cmd-input" 
      autocomplete="off" 
      autocorrect="off" 
      autocapitalize="none" 
      spellcheck="false" 
      placeholder="Type help, status, read sector-01, or tftc..."
    />
  </div>
</div>

<script>
  // --- CONFIG & GLOBAL MEMORY ---
  const CONFIG = {
    version: "v1.04-SOS",
    toolsUrl: "https://www.cachesleuth.com/",
    certitudeUrl: "https://www.certitude.org/",
    storagePrefix: "cipher_"
  };

  let telemetryData = null;
  const screenEl = document.getElementById("screen");
  const inputEl = document.getElementById("cmd-input");
  let audioCtx = null;

  // --- AUDIO SYNTHESIS ENGINE ---
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  function playTone(freq, type = "sine", duration = 0.1, stopRamp = true) {
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      if (stopRamp) {
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      }
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function playSuccessSweep() {
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
      osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.45);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.45);
    } catch (e) {}
  }

  function playErrorBuzz() {
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(140, audioCtx.currentTime);
      osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    } catch (e) {}
  }

  function playMetallicClank() {
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(90, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.18);
    } catch (e) {}
  }

  // --- TERMINAL PRINT UTILITIES ---
  function print(htmlText, playClick = true) {
    const p = document.createElement("div");
    p.innerHTML = htmlText;
    screenEl.appendChild(p);
    screenEl.scrollTop = screenEl.scrollHeight;
    if (playClick) playTone(950, "sine", 0.03);
  }

  function focusInput() {
    initAudio();
    inputEl.focus();
  }

  function escapeHtml(str) {
    return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function sleep(ms) { 
    return new Promise(r => setTimeout(r, ms)); 
  }

  // --- STATE PERSISTENCE ---
  function getRestoredSectors() {
    try {
      const data = localStorage.getItem(`${CONFIG.storagePrefix}restored_sectors`);
      return data ? JSON.parse(data) : [];
    } catch (e) {
      return [];
    }
  }

  function saveRestoredSector(sectorId) {
    const current = getRestoredSectors();
    if (!current.includes(sectorId)) {
      current.push(sectorId);
      localStorage.setItem(`${CONFIG.storagePrefix}restored_sectors`, JSON.stringify(current));
    }
  }

  async function loadTelemetry() {
    try {
      const res = await fetch(`telemetry.json?t=${Date.now()}`, { cache: "no-store" });
      if (res.ok) {
        telemetryData = await res.json();
      }
    } catch (e) {
      console.warn("Using inline fallback definitions.", e);
    }
  }

  function calculateIntegrity() {
    const restored = getRestoredSectors();
    if (restored.length === 0) return "3.1%";
    if (restored.length === 1) return "3.3%";
    if (restored.length === 2) return "6.8%";
    return "100.0%";
  }

  // --- COMMAND ROUTING & ALIASES ---
  const VERB_MAP = {
    RESTORE: ["RESTORE", "REPAIR", "FIX"],
    COLLECT: ["COLLECT", "TAKE", "ACQUIRE"],
    DISCOVER: ["DISCOVER", "FOUND", "INSPECT"],
    LOG: ["LOG", "SIGN", "CHECKIN"],
    DEPOSIT: ["DEPOSIT", "DROP", "SUBMIT"],
    PATCH: ["PATCH", "MOUNT", "LOAD", "INJECT"],
    READ: ["READ", "CAT", "VIEW"],
    STATUS: ["STATUS", "SYS", "TELEMETRY"],
    HELP: ["HELP", "MAN", "?"],
    TEST: ["TEST", "DIAG"],
    CLEAR: ["CLEAR", "CLS"],
    REBOOT: ["REBOOT", "RESET"],
    SLEUTH: ["SLEUTH", "INVESTIGATE", "CASE"],
    AUTH: ["AUTH", "UNLOCK"],
    // Easter Egg Memes
    TFTC: ["TFTC", "THANKS"],
    SWAG: ["SWAG", "TRADE", "INVENTORY"],
    HINT: ["HINT", "CLUE"],
    BYOP: ["BYOP", "PEN"],
    KICK: ["KICK", "HIT", "SHAKE", "PERCUSSION"]
  };

  function resolveVerb(verb) {
    const upper = verb.toUpperCase();
    for (const [canonical, aliases] of Object.entries(VERB_MAP)) {
      if (aliases.includes(upper)) return canonical;
    }
    return upper;
  }

  // --- COMMAND INTERPRETER ---
  async function processCommand(raw) {
    const input = raw.trim();
    if (!input) return;

    print(`<span style="color:#58a6ff;">&gt; ${escapeHtml(input)}</span>`, false);

    const parts = input.split(/\s+/);
    const verb = resolveVerb(parts[0]);
    const arg = parts.slice(1).join(" ").trim();

    // Auto-route memory tokens typed with other verbs
    if (["LOG", "DISCOVER", "COLLECT", "DEPOSIT", "PATCH"].includes(verb) && arg.toUpperCase().startsWith("CIPHER-")) {
      print(`[!] Notice: Memory bit detected. Auto-routing to RESTORE protocol...`);
      return handleRestore(arg);
    }

    switch (verb) {
      case "HELP":
        print(`
C.I.P.H.E.R. MAINTENANCE SHELL // REV 1.04-SOS
Type a command and press ENTER.

  <span class="highlight">RESTORE &lt;KEY&gt;</span>     Reconstruct corrupted core sector files
  <span class="highlight">READ &lt;SECTOR-ID&gt;</span>   Read memory sector bank (e.g., READ SECTOR-01)
  <span class="highlight">STATUS</span>             Display chassis telemetry & sector integrity
  <span class="highlight">DISCOVER &lt;ID&gt;</span>     Catalog discovered node or trackable chip
  <span class="highlight">COLLECT &lt;ID&gt;</span>      Ingest physical collectible card
  <span class="highlight">LOG &lt;ID&gt;</span>          Record field cache sign-in
  <span class="highlight">DEPOSIT &lt;ID&gt;</span>      Submit drop-box memory payload
  <span class="highlight">PATCH &lt;KEY&gt;</span>        Apply firmware update / security override
  <span class="highlight">SLEUTH</span>             Intercept legacy radio transmission
  <span class="highlight">AUTH &lt;PASSKEY&gt;</span>     Submit decoded authorization key
  <span class="highlight">TEST ALL</span>           Run full diagnostic regression suite
  <span class="highlight">CLEAR</span>              Clear display buffer
  <span class="highlight">REBOOT</span>             Reset local memory tables`);
        break;

      case "STATUS":
        handleStatus();
        break;

      case "RESTORE":
        await handleRestore(arg);
        break;

      case "READ":
        handleRead(arg);
        break;

      case "TFTC":
        print(`[SYS_RESPONSE]: "You're welcome. Now please replace the container exactly how you found it. The last finder left it visible from thirty paces."`);
        break;

      case "SWAG":
        print(`
[PHYSICAL SWAG REPOSITORY DUMP]:
  - 1x Flattened souvenir penny (1998)
  - 1x Scented eraser (completely waterlogged, smells of mud)
  - 1x Broken plastic dinosaur (torso only)
  - 1x Expired coupon for Arby's (2004)
  - 0x Working pens`);
        break;

      case "HINT":
        print(`[SYS_RESPONSE]: "Look at eye level. No, your eye level, not the dog's. If you are digging up the landscaping bark, stop immediately. It's not in the sprinkler."`);
        break;

      case "BYOP":
        print(`[SYS_RESPONSE]: "Warning: Terminal does not dispense writing utensils. If you attempt to scratch your log onto my chassis with a house key, static will be discharged into your thumb."`);
        break;

      case "KICK":
        playMetallicClank();
        print(`
[!] Percussive maintenance applied to 1/4-inch rolled steel plate.
[SYS_RESPONSE]: "Go ahead, kick it again. Welded by retired rocket motor machinists in 1987. You're going to break your boot."`);
        break;

      case "DISCOVER":
      case "COLLECT":
      case "LOG":
      case "DEPOSIT":
      case "PATCH":
        if (!arg) {
          playErrorBuzz();
          print(`<span class="err-text">[!] Syntax Error: ID parameter required for ${verb}.</span>`);
          return;
        }
        playTone(550, "sine", 0.08);
        print(`[+] Protocol '${verb}' registered for: <span class="highlight">${escapeHtml(arg.toUpperCase())}</span>. Awaiting physical field node sync.`);
        break;

      case "SLEUTH":
        playTone(700, "sine", 0.08);
        setTimeout(() => playTone(1200, "sine", 0.12), 90);
        print(`
============================================================
[RELAY NODE 01: INTERCEPTED CIPHER TRANSMISSION]
============================================================
SYSOP INTERCEPT: S.O.S. LEGACY BEACON FREQUENCY 146.520 MHz
ENCRYPTION TYPE: CORRIDOR CAESAR SHIFT (EPOCH OFFSET: -6)

RAW TELEMETRY PAYLOAD:
<div style="background:#05160c; border:1px dashed #00ff66; padding:8px; margin:6px 0; font-size:16px; letter-spacing:2px; color:#fff; text-align:center;">
  NKXJ-YOMTGR-702
</div>

INSTRUCTIONS:
1. Decode this payload using <a href="${CONFIG.toolsUrl}" target="_blank" rel="noopener noreferrer">CacheSleuth</a>.
2. Submit the decoded plaintext using: <span class="highlight">auth &lt;DECODED_KEY&gt;</span>
============================================================`);
        break;

      case "AUTH":
        if (!arg) {
          playErrorBuzz();
          print(`<span class="err-text">[!] SYNTAX ERROR: Usage: auth &lt;PASSKEY&gt;</span>`);
          return;
        }
        if (arg.toUpperCase() === "AUTH-SIGNAL-702" || arg.toUpperCase() === "PASSKEY-SLEUTH-42") {
          localStorage.setItem(`${CONFIG.storagePrefix}clearance_level`, "1");
          localStorage.setItem(`${CONFIG.storagePrefix}node01_unlocked`, "true");
          playSuccessSweep();
          print(`
============================================================
[+] HANDSHAKE VERIFIED: PASSKEY ACCEPTED
============================================================
SECURITY STATUS: ELEVATED TO CLEARANCE LEVEL 1
ACHIEVEMENT: [S.O.S. TIER 1 CITATION UNLOCKED]

To recover memory banks and Certitude coordinates, locate
the field recovery key and run:
<span class="highlight">RESTORE &lt;RECOVERY_KEY&gt;</span>
============================================================`);
        } else {
          playErrorBuzz();
          print(`<span class="err-text">[!] REJECTION: Checksum parity error for '${escapeHtml(arg)}'. Check your cipher decode.</span>`);
        }
        break;

      case "TEST":
        if (arg.toUpperCase() === "ALL") {
          await runDiagnosticSuite();
        } else {
          print(`Type <span class="highlight">test all</span> to run the diagnostic suite.`);
        }
        break;

      case "CLEAR":
        screenEl.innerHTML = "";
        break;

      case "REBOOT":
        localStorage.clear();
        print(`[*] System rebooted. Local memory wiped.`);
        setTimeout(initTerminal, 600);
        break;

      default:
        playErrorBuzz();
        print(`<span class="err-text">Unknown command '${escapeHtml(parts[0])}'. Type HELP for manual.</span>`);
    }
  }

  // --- SECTOR HANDLERS ---
  async function handleRestore(rawKey) {
    if (!rawKey) {
      playErrorBuzz();
      print(`<span class="err-text">[!] Usage: RESTORE &lt;KEY&gt; (e.g., RESTORE CIPHER-7K9A-4R2M)</span>`);
      return;
    }

    const key = rawKey.toUpperCase();
    const sectors = (telemetryData && telemetryData.archive_sectors) || [];
    const match = sectors.find(s => s.validation_key === key);

    if (match) {
      saveRestoredSector(match.sector_id);
      playSuccessSweep();
      print(`
[+] INGESTING VALIDATION STRING: ${escapeHtml(key)}
[+] PARITY VERIFICATION: 0x${escapeHtml(key.split("-")[1] || "OK")}... OK
[+] AUTHENTICATING S.O.S. RECOVERY STRING... VALID.
[+] REBUILDING PARITY TABLES... [████████████████████] 100%
[+] ${match.sector_id} RESTORED TO LOCAL ARCHIVE.

-----------------------------------------------------------
RESTORED LOG: ${match.sector_id} // ARCHIVE REF: ${match.archive_ref}
-----------------------------------------------------------
"${escapeHtml(match.restored_payload.log_body)}"

<div class="badge-box">
  CERTITUDE KEYWORD: <span style="color:#ffffff; font-weight:bold; background:#1f6feb; padding:2px 6px;">${escapeHtml(match.restored_payload.certitude_keyword)}</span>
</div>

Validate keyword on the listing's Certitude checker:
<a href="${CONFIG.certitudeUrl}" target="_blank" rel="noopener noreferrer">[OPEN CERTITUDE VALIDATOR]</a>
-----------------------------------------------------------
<span style="color:#88cc88;">[SYS_NOTE]: ${escapeHtml(match.restored_payload.system_whisper)}</span>`);
    } else {
      playErrorBuzz();
      print(`
[!] INGESTING VALIDATION STRING: ${escapeHtml(key)}
[!] PARITY VERIFICATION... FAILED.
<span class="err-text">[!] ERROR 0x7E1: CHECKSUM MISMATCH. Check your physical token.</span>`);
    }
  }

  function handleRead(target) {
    if (!target) {
      playErrorBuzz();
      print(`<span class="err-text">[!] Specify target. Usage: READ &lt;SECTOR-ID&gt; (e.g., READ SECTOR-01)</span>`);
      return;
    }

    const sectorId = target.toUpperCase();
    const sectors = (telemetryData && telemetryData.archive_sectors) || [];
    const targetSector = sectors.find(s => s.sector_id === sectorId);
    const restoredList = getRestoredSectors();

    if (restoredList.includes(sectorId)) {
      const payload = targetSector ? targetSector.restored_payload : null;
      print(`
-----------------------------------------------------------
ARCHIVE REF: ${targetSector ? targetSector.archive_ref : "LOCAL"} // ${sectorId}
-----------------------------------------------------------
"${payload ? escapeHtml(payload.log_body) : "Sector active."}"

CERTITUDE KEYWORD: ${payload ? escapeHtml(payload.certitude_keyword) : "[LOCKED]"}
-----------------------------------------------------------
[SYS_STATUS]: Sector stable.`);
      return;
    }

    if (targetSector) {
      playTone(320, "sawtooth", 0.08);
      print(`
[!] ACCESSING MEMORY BANK ${targetSector.memory_bank}...
<span class="err-text">[!] ERROR 0x884: PARITY CHECK FAILED. WATERLOGGED / CORRUPTED.</span>

${escapeHtml(targetSector.corrupted_display.hex_prefix)}
${escapeHtml(targetSector.corrupted_display.raw_text)}

[!] INTEGRITY: ${targetSector.corrupted_display.integrity_percent}
[!] Use '<span class="highlight">RESTORE &lt;KEY&gt;</span>' with a field token to rebuild parity.`);
    } else {
      playErrorBuzz();
      print(`<span class="err-text">[!] Memory address '${escapeHtml(sectorId)}' offline or unallocated.</span>`);
    }
  }

  function handleStatus() {
    const restored = getRestoredSectors();
    const sectors = (telemetryData && telemetryData.archive_sectors) || [
      { sector_id: "SECTOR-01" },
      { sector_id: "SECTOR-02" },
      { sector_id: "SECTOR-03" }
    ];

    let sectorReport = "";
    sectors.forEach(s => {
      const isOk = restored.includes(s.sector_id);
      sectorReport += `  ${s.sector_id}: ${isOk ? "[ONLINE / PARITY VERIFIED]" : "[CORRUPTED / RECOVERY REQUIRED]"}\n`;
    });

    const currentIntegrity = calculateIntegrity();

    print(`
===========================================================
C.I.P.H.E.R. SYSTEM INTEGRITY REPORT
===========================================================
CHASSIS SPEC:   1/4-inch rolled steel // Surplus rocket housing
MAINTENANCE:    Welded 1987 // R.S.I. stamped PASS
CURRENT FAUNA:  1 earwig nesting across pin 4 (uneasy truce)
SYSOP STATUS:   CRITICALLY DEGRADED (~96.9% lost to moisture)

ALLOCATED ARCHIVE SECTORS:
${sectorReport}
ACTIVE PARITY INDEX: ${currentIntegrity}
===========================================================`);
  }

  // --- DIAGNOSTIC HARNESS ---
  async function runDiagnosticSuite() {
    print(`\n--- RUNNING SYSTEM DIAGNOSTIC HARNESS ---`);
    playTone(600, "sine", 0.08);
    await sleep(150);
    playTone(900, "triangle", 0.08);
    print(`[1/3] Oscillator pipeline: Nominal.`);

    await loadTelemetry();
    if (telemetryData && telemetryData.archive_sectors) {
      print(`[2/3] telemetry.json: Active (${telemetryData.archive_sectors.length} sectors indexed).`);
    } else {
      print(`[2/3] <span class="err-text">telemetry.json: Using internal fallback.</span>`);
    }

    const testKey = "CIPHER-7K9A-4R2M";
    const sectors = (telemetryData && telemetryData.archive_sectors) || [];
    const valid = sectors.some(s => s.validation_key === testKey);
    print(`[3/3] Token Parity Parser (${testKey}): ${valid ? "VALID" : "FAILED"}`);
    print(`\n[✔] TEST ALL COMPLETE: Parity check finished.\n`);
  }

  // --- BOOT SEQUENCE ---
  async function initTerminal() {
    screenEl.innerHTML = "";
    await loadTelemetry();

    const banner = `
  ___   ___  ____   __  __  ____  ____ 
 / __) (_  )(  _ \\ (  )(  )(  __)(  _ \\
( (__   / /  ) __/  )(__)(  ) _)  )   /
 \\___) (___)(__)   (______)(____)(__\\_)
 C.I.P.H.E.R. MAINTENANCE SHELL // REV 1.04-SOS
 CHASSIS: R.S.I. RELIC HOUSING #04 (ROCKET CASING)
 MEMORY INTEGRITY: ${calculateIntegrity()} [CRITICAL CORRUPTION]
=================================================`;
    print(`<div class="banner">${banner}</div>`, false);
    print(`[SYSTEM BOOT]: Relay operational. Earwig present.`);
    print(`Type <span class="highlight">status</span>, <span class="highlight">read sector-01</span>, or <span class="highlight">help</span> for directives.\n`, false);

    // Auto-ingest URL tokens from NFC/QR scans
    const urlParams = new URLSearchParams(window.location.search);
    const inboundKey = urlParams.get("token") || 
                       urlParams.get("restore") || 
                       urlParams.get("inject") || 
                       urlParams.get("key");

    if (inboundKey) {
      await sleep(350);
      print(`\n<span class="warn-text">[!] DETECTED INBOUND HARDWARE TOKEN PAYLOAD...</span>`);
      await sleep(300);
      await processCommand(`RESTORE ${inboundKey}`);
    }
  }

  inputEl.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      const val = inputEl.value;
      inputEl.value = "";
      processCommand(val);
    }
  });

  window.addEventListener("load", initTerminal);
</script>
</body>
</html>
