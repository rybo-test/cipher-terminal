<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>C.I.P.H.E.R. // Field Pack & Inventory</title>
  <link rel="stylesheet" href="css/cipher-style.css">
  <style>
    .inventory-nav-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 4px;
      overflow-x: auto;
    }

    .inv-tab {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-dim);
      padding: 6px 10px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .inv-tab.active {
      background-color: var(--bg-surface-raised);
      color: var(--text-bright);
      border-color: var(--border-bright);
    }

    .hardware-spec-bar {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-bright);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }

    .hardware-spec-bar strong {
      color: var(--text-bright);
    }

    .items-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item-card.is-part {
      border-color: var(--border-bright);
    }

    .item-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-tag {
      font-size: 0.7rem;
      padding: 2px 4px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-dim);
      font-weight: bold;
    }

    .item-tag.tag-part {
      border-color: var(--border-bright);
      color: var(--text-bright);
    }

    .item-tag.tag-key {
      border-color: var(--accent-amber);
      color: var(--accent-amber);
    }

    .item-name {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--text-bright);
    }

    .item-desc {
      font-size: 0.75rem;
      color: var(--text-dim);
      line-height: 1.3;
    }

    .item-action-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .voucher-dock {
      background-color: var(--bg-surface-raised);
      border: 1px solid var(--border-color);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Top System Telemetry Bar -->
    <header class="status-header">
      <span class="brand-title">C.I.P.H.E.R. // FIELD PACK</span>
      <span class="telemetry-pill">STORAGE: SYNCHRONIZED</span>
    </header>

    <!-- Scrollable Viewport Stage -->
    <main class="viewport-stage">
      
      <!-- Live Terminal Hardware Specs -->
      <div class="hardware-spec-bar">
        <div>MAINFRAME RAM: <strong id="spec-ram">64KB</strong></div>
        <div>BUS: <strong id="spec-bus">1.77 MHz</strong></div>
        <div>FLOAT: <strong id="spec-voltage">12.6V</strong></div>
      </div>

      <!-- Inventory Category Navigation Filter -->
      <div class="inventory-nav-tabs">
        <button class="inv-tab active" onclick="PackController.filterTab('ALL')">[ ALL ITEMS ]</button>
        <button class="inv-tab" onclick="PackController.filterTab('TOOL')">[ TOOLS ]</button>
        <button class="inv-tab" onclick="PackController.filterTab('PART')">[ TECH & PARTS ]</button>
        <button class="inv-tab" onclick="PackController.filterTab('KEY')">[ SWAG & KEYS ]</button>
      </div>

      <!-- Items List -->
      <div id="items-container" class="items-grid">
        <!-- Rendered dynamically by PackController -->
      </div>

      <!-- Physical Container Lid & Voucher Code Redemption Dock -->
      <div class="voucher-dock">
        <div class="panel-header">FIELD VOUCHER REDEMPTION DOCK</div>
        <div style="font-size: 0.72rem; color: var(--text-dim);">
          Enter codes stamped under physical ammo can lids or washers found in the field.
        </div>
        <div style="display: flex; gap: 8px; margin-top: 4px;">
          <input type="text" id="voucher-input" class="cipher-input" placeholder="STAMPED VOUCHER..." autocomplete="off">
          <button class="btn-cipher primary" onclick="PackController.redeemVoucher()">[ CLAIM ]</button>
        </div>
      </div>

    </main>

    <!-- Symmetrical 4-Anchor Bottom Navigation -->
    <nav class="nav-anchor-strip">
      <a href="mission.html" class="nav-tab">
        <span>[ 🔓 ]</span>
        <span>MISSION</span>
      </a>
      <a href="map.html" class="nav-tab">
        <span>[ 🗺️ ]</span>
        <span>MAP</span>
      </a>
      <a href="pack.html" class="nav-tab active">
        <span>[ 🎒 ]</span>
        <span>PACK</span>
      </a>
      <a href="profile.html" class="nav-tab">
        <span>[ ⚙️ ]</span>
        <span>MENU</span>
      </a>
    </nav>
  </div>

  <script src="js/cipher-audio.js"></script>
  <script src="js/cipher-core.js"></script>
  <script>
    const PackController = (function () {
      let activeFilter = 'ALL';

      return {
        init: function () {
          this.updateHardwareDisplay();
          this.renderInventory();
        },

        updateHardwareDisplay: function () {
          const state = CipherCore.getState();
          document.getElementById('spec-ram').textContent = `${state.hardware.ramKB}KB`;
          document.getElementById('spec-bus').textContent = state.hardware.busSpeed;
          document.getElementById('spec-voltage').textContent = state.hardware.floatVoltage;
        },

        filterTab: function (category) {
          CipherAudio.click();
          activeFilter = category;
          const tabs = document.querySelectorAll('.inv-tab');
          tabs.forEach(tab => {
            if (tab.textContent.includes(category)) {
              tab.classList.add('active');
            } else {
              tab.classList.remove('active');
            }
          });
          this.renderInventory();
        },

        renderInventory: function () {
          const state = CipherCore.getState();
          const container = document.getElementById('items-container');
          container.innerHTML = '';

          const filtered = state.inventory.filter(item => {
            if (activeFilter === 'ALL') return true;
            return item.type === activeFilter;
          });

          if (filtered.length === 0) {
            container.innerHTML = `
              <div class="cipher-panel" style="text-align: center; color: var(--text-dim); font-size: 0.8rem; padding: 20px;">
                NO ASSETS MATCHING CATEGORY [${activeFilter}]
              </div>
            `;
            return;
          }

          filtered.forEach(item => {
            const isPart = item.type === 'PART';
            const isKey = item.type === 'KEY' || item.type === 'PERMIT';

            const card = document.createElement('div');
            card.className = `item-card ${isPart ? 'is-part' : ''}`;

            card.innerHTML = `
              <div class="item-header-row">
                <span class="item-name">${item.name}</span>
                <span class="item-tag ${isPart ? 'tag-part' : (isKey ? 'tag-key' : '')}">[${item.type}]</span>
              </div>
              <div class="item-desc">${item.desc}</div>
              <div class="item-action-row">
                ${isPart ? `<button class="btn-cipher primary" style="font-size: 0.75rem; padding: 4px 8px;" onclick="PackController.feedItem('${item.id}')">[ ⚡ FEED TO CIPHER ]</button>` : ''}
                <button class="btn-cipher" style="font-size: 0.75rem; padding: 4px 8px;" onclick="PackController.inspectItem('${item.name}')">[ 🔍 INSPECT ]</button>
              </div>
            `;

            container.appendChild(card);
          });
        },

        feedItem: function (itemId) {
          const result = CipherCore.feedItemToCipher(itemId);
          if (result.success) {
            this.updateHardwareDisplay();
            this.renderInventory();
          } else {
            CipherAudio.buzz();
            alert(result.reason);
          }
        },

        inspectItem: function (name) {
          CipherAudio.click();
          alert(`[ITEM INSPECTION] // ${name}\nSerial etching and hardware marks verified authentic.`);
        },

        redeemVoucher: function () {
          const input = document.getElementById('voucher-input');
          const code = input.value.trim().toUpperCase();
          if (!code) return;

          // Example Field Container Lid Codes
          if (code === "GC1-LID-ANCHOR" || code === "ANCHOR-LID-72") {
            CipherAudio.chime();
            const state = CipherCore.getState();

            // Check if already claimed
            if (state.inventory.some(i => i.id === 'PART_TUNING_COIL')) {
              alert("Lid voucher already claimed in pack.");
              return;
            }

            state.inventory.push({
              id: 'PART_TUNING_COIL',
              type: 'PART',
              name: 'Antenna Tuning Coil (Surplus)',
              desc: 'High-gain ferrite coil found inside Cache 01. Can be fed to C.I.P.H.E.R. to stabilize audio frequencies.',
              consumable: true,
              targetUpgrade: 'ramKB',
              upgradeVal: 256
            });

            CipherCore.commitMilestone('VOUCHER_CLAIMED', { code: code });
            CipherAudio.speak("Lid voucher verified. Surplus hardware added to pack.");
            input.value = '';
            this.renderInventory();
          } else {
            CipherAudio.buzz();
            alert("INVALID VOUCHER CODE. Check the physical container stamp.");
            input.value = '';
          }
        }
      };
    })();

    document.addEventListener('DOMContentLoaded', () => {
      PackController.init();
    });
  </script>
</body>
</html>
