<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C.I.P.H.E.R. // Field Pack</title>
  <link rel="stylesheet" href="css/cipher-style.css?v=3.50">
  <style>
    /* Direct Fail-Safe Inlined Styles */
    :root {
      --bg-primary: #050a06;
      --bg-surface: #0a140d;
      --bg-surface-raised: #112015;
      --border-color: #1b3822;
      --border-bright: #00e676;
      --text-main: #ffffff;
      --text-bright: #00e676;
      --text-dim: #a7f3d0;
      --accent-amber: #ffb300;
      --font-mono: 'Courier New', Courier, monospace;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100dvh;
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 15px;
      line-height: 1.45;
      overflow: hidden;
      touch-action: manipulation;
    }
    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 600px;
      height: 100dvh;
      margin: 0 auto;
      background-color: var(--bg-primary);
      position: relative;
    }
    .status-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-surface);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .status-header h1.brand-title {
      color: var(--text-bright);
      font-family: var(--font-ui);
      font-size: 14px;
      letter-spacing: 0.5px;
      margin: 0;
    }
    .status-header .telemetry-pill {
      color: var(--text-dim);
      font-size: 12px;
    }
    .viewport-stage {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .hardware-spec-bar {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-bright);
      padding: 10px 14px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      text-align: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .hardware-spec-bar .spec-item-title {
      color: var(--text-dim);
      font-size: 11px;
    }
    .hardware-spec-bar .spec-item-val {
      color: var(--text-bright);
      font-size: 15px;
      font-weight: bold;
      margin-top: 2px;
    }
    .inventory-nav-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .inventory-nav-tabs::-webkit-scrollbar { display: none; }
    .inv-tab {
      flex: 1 0 auto;
      min-width: 80px;
      min-height: 44px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-dim);
      padding: 0 14px;
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .inv-tab.active {
      background-color: var(--bg-surface-raised);
      color: var(--text-bright);
      border-color: var(--border-bright);
    }
    .item-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item-card.is-part {
      border-color: var(--border-bright);
    }
    .item-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-name {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      margin: 0;
    }
    .item-tag {
      font-size: 11px;
      padding: 2px 6px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-dim);
      font-weight: bold;
    }
    .item-tag.tag-part {
      border-color: var(--border-bright);
      color: var(--text-bright);
    }
    .item-desc {
      font-size: 14px;
      color: #d1fae5;
      line-height: 1.4;
    }
    .cipher-panel {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 14px;
    }
    .panel-header {
      font-size: 13px;
      font-weight: bold;
      color: var(--accent-amber);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 4px;
    }
    .voucher-dock-form {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .cipher-input {
      flex: 1;
      min-height: 44px;
      background-color: #ffffff;
      border: 2px solid var(--border-bright);
      color: #000000;
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: bold;
      padding: 0 12px;
      text-transform: uppercase;
      outline: none;
    }
    .btn-cipher {
      background-color: var(--bg-surface-raised);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      min-height: 44px;
      padding: 10px 16px;
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      touch-action: manipulation;
    }
    .btn-cipher.primary {
      border-color: var(--border-bright);
      color: var(--text-bright);
    }
    .ui-icon {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }
    .ui-icon-nav {
      width: 22px;
      height: 22px;
      margin-bottom: 2px;
    }
    .nav-anchor-strip {
      display: flex;
      width: 100%;
      height: calc(56px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      border-top: 1px solid var(--border-color);
      background-color: var(--bg-surface);
      z-index: 10;
      flex-shrink: 0;
    }
    .nav-tab {
      flex: 1 1 25%;
      width: 25%;
      min-height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      border-right: 1px solid var(--border-color);
      color: var(--text-dim);
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      text-decoration: none;
      touch-action: manipulation;
    }
    .nav-tab:last-child {
      border-right: none;
    }
    .nav-tab.active {
      color: var(--text-bright);
      background-color: var(--bg-surface-raised);
      border-top: 3px solid var(--border-bright);
    }
    .nav-tab.active .ui-icon {
      stroke: var(--text-bright);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="status-header">
      <h1 class="brand-title">C.I.P.H.E.R. // FIELD PACK</h1>
      <div class="telemetry-pill" role="status" aria-label="Storage Status">STORAGE: SYNCED</div>
    </header>

    <main class="viewport-stage">
      <section class="hardware-spec-bar" aria-label="Mainframe Hardware Status">
        <div>
          <div class="spec-item-title">MAINFRAME RAM</div>
          <div class="spec-item-val" id="spec-ram">128KB</div>
        </div>
        <div>
          <div class="spec-item-title">BUS SPEED</div>
          <div class="spec-item-val" id="spec-bus">1.77 MHz</div>
        </div>
        <div>
          <div class="spec-item-title">FLOAT VOLTAGE</div>
          <div class="spec-item-val" id="spec-voltage">12.6V</div>
        </div>
      </section>

      <section aria-label="Inventory Category Filters">
        <div class="inventory-nav-tabs" role="tablist">
          <button role="tab" aria-selected="true" class="inv-tab active" onclick="PackController.filterTab('ALL')">ALL</button>
          <button role="tab" aria-selected="false" class="inv-tab" onclick="PackController.filterTab('TOOL')">TOOLS</button>
          <button role="tab" aria-selected="false" class="inv-tab" onclick="PackController.filterTab('PART')">PARTS</button>
          <button role="tab" aria-selected="false" class="inv-tab" onclick="PackController.filterTab('KEY')">SWAG</button>
        </div>
      </section>

      <section id="items-container" aria-label="Equipment Deck" style="display: flex; flex-direction: column; gap: 8px;"></section>

      <section class="cipher-panel" style="margin-top: auto;" aria-labelledby="voucher-dock-title">
        <h2 id="voucher-dock-title" class="panel-header">FIELD VOUCHER REDEMPTION DOCK</h2>
        <p id="voucher-instructions" style="font-size: 13px; color: #a7f3d0; line-height: 1.35;">
          Enter codes stamped under physical ammo can lids or washers found in the field.
        </p>
        <form class="voucher-dock-form" onsubmit="event.preventDefault(); PackController.redeemVoucher();">
          <label for="voucher-input" class="sr-only">Stamped Field Voucher Code</label>
          <input 
            type="text" 
            id="voucher-input" 
            name="voucherCode"
            class="cipher-input" 
            placeholder="STAMPED VOUCHER..." 
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
            inputmode="text"
            enterkeyhint="go"
            required
            aria-describedby="voucher-instructions"
          >
          <button type="submit" class="btn-cipher primary">[ CLAIM ]</button>
        </form>
      </section>
    </main>

    <nav class="nav-anchor-strip" aria-label="Primary Navigation">
      <a href="mission.html" class="nav-tab">
        <svg class="ui-icon ui-icon-nav" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <span>MISSION</span>
      </a>
      <a href="map.html" class="nav-tab">
        <svg class="ui-icon ui-icon-nav" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
        <span>MAP</span>
      </a>
      <a href="pack.html" class="nav-tab active" aria-current="page">
        <svg class="ui-icon ui-icon-nav" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 10a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10z"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path></svg>
        <span>PACK</span>
      </a>
      <a href="profile.html" class="nav-tab">
        <svg class="ui-icon ui-icon-nav" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>MENU</span>
      </a>
    </nav>
  </div>

  <script src="js/cipher-audio.js"></script>
  <script src="js/cipher-core.js"></script>
  <script>
    const PackController = (function () {
      let activeFilter = 'ALL';

      const defaultItems = [
        {
          id: 'TOOL_ROT13',
          type: 'TOOL',
          name: 'Rot13 Cipher Card',
          desc: 'Standard field rotation tool for deciphering log hints.',
          consumable: false
        },
        {
          id: 'PART_RAM64',
          type: 'PART',
          name: '64KB RAM Expansion Board',
          desc: 'Surplus aerospace board. Can be fed to C.I.P.H.E.R. to boost memory.',
          consumable: true,
          targetUpgrade: 'ramKB',
          upgradeVal: 128
        }
      ];

      return {
        init: function () {
          this.updateHardwareDisplay();
          this.renderInventory();
        },

        updateHardwareDisplay: function () {
          const state = (typeof CipherCore !== 'undefined') ? CipherCore.getState() : { hardware: { ramKB: 128, busSpeed: '1.77 MHz', floatVoltage: '12.6V' } };
          document.getElementById('spec-ram').textContent = `${state.hardware.ramKB}KB`;
          document.getElementById('spec-bus').textContent = state.hardware.busSpeed;
          document.getElementById('spec-voltage').textContent = state.hardware.floatVoltage;
        },

        filterTab: function (category) {
          if (typeof CipherAudio !== 'undefined') CipherAudio.click();
          activeFilter = category;
          document.querySelectorAll('.inv-tab').forEach(tab => {
            const isMatch = tab.textContent.includes(category);
            tab.classList.toggle('active', isMatch);
            tab.setAttribute('aria-selected', isMatch ? 'true' : 'false');
          });
          this.renderInventory();
        },

        renderInventory: function () {
          const state = (typeof CipherCore !== 'undefined') ? CipherCore.getState() : { inventory: defaultItems };
          const items = state.inventory || defaultItems;
          const container = document.getElementById('items-container');
          container.innerHTML = '';

          const filtered = items.filter(item => {
            if (activeFilter === 'ALL') return true;
            return item.type === activeFilter;
          });

          if (filtered.length === 0) {
            container.innerHTML = `
              <div class="cipher-panel" style="text-align: center; color: var(--text-dim); padding: 18px; font-size: 14px;">
                NO ASSETS IN PACK UNDER [${activeFilter}]
              </div>
            `;
            return;
          }

          filtered.forEach(item => {
            const isPart = item.type === 'PART';
            const card = document.createElement('article');
            card.className = `item-card ${isPart ? 'is-part' : ''}`;

            card.innerHTML = `
              <div class="item-header-row">
                <h3 class="item-name">${item.name}</h3>
                <span class="item-tag ${isPart ? 'tag-part' : ''}">[${item.type}]</span>
              </div>
              <p class="item-desc">${item.desc}</p>
              <div style="display: flex; gap: 8px; margin-top: 6px;">
                ${isPart ? `<button class="btn-cipher primary" style="font-size: 13px; min-height: 44px; padding: 0 14px;" onclick="PackController.feedItem('${item.id}')">[ ⚡ FEED TO CIPHER ]</button>` : ''}
                <button class="btn-cipher" style="font-size: 13px; min-height: 44px; padding: 0 14px;" onclick="PackController.inspectItem('${item.name}')">[ 🔍 INSPECT ]</button>
              </div>
            `;

            container.appendChild(card);
          });
        },

        feedItem: function (itemId) {
          if (typeof CipherCore !== 'undefined') {
            const result = CipherCore.feedItemToCipher(itemId);
            if (result.success) {
              this.updateHardwareDisplay();
              this.renderInventory();
            } else {
              if (typeof CipherAudio !== 'undefined') CipherAudio.buzz();
              alert(result.reason);
            }
          }
        },

        inspectItem: function (name) {
          if (typeof CipherAudio !== 'undefined') CipherAudio.click();
          alert(`[INSPECTOR] // ${name}\nSerial markings verified authentic.`);
        },

        redeemVoucher: function () {
          const input = document.getElementById('voucher-input');
          const code = input.value.trim().toUpperCase();
          if (!code) return;

          if (code === "GC1-LID-ANCHOR" || code === "ANCHOR-LID-72") {
            if (typeof CipherAudio !== 'undefined') CipherAudio.chime();
            const state = (typeof CipherCore !== 'undefined') ? CipherCore.getState() : { inventory: [] };

            if (state.inventory && state.inventory.some(i => i.id === 'PART_TUNING_COIL')) {
              alert("Lid voucher already claimed in pack.");
              return;
            }

            if (state.inventory) {
              state.inventory.push({
                id: 'PART_TUNING_COIL',
                type: 'PART',
                name: 'Antenna Tuning Coil (Surplus)',
                desc: 'High-gain ferrite coil found in Cache 01. Feed to C.I.P.H.E.R. to boost RAM to 256KB.',
                consumable: true,
                targetUpgrade: 'ramKB',
                upgradeVal: 256
              });
            }

            if (typeof CipherCore !== 'undefined') {
              CipherCore.commitMilestone('VOUCHER_CLAIMED', { code: code });
            }
            if (typeof CipherAudio !== 'undefined') {
              CipherAudio.speak("Lid voucher verified. Surplus hardware added to pack.");
            }
            input.value = '';
            this.renderInventory();
          } else {
            if (typeof CipherAudio !== 'undefined') CipherAudio.buzz();
            alert("INVALID VOUCHER CODE. Check the physical ammo can lid stamp.");
            input.value = '';
          }
        }
      };
    })();

    document.addEventListener('DOMContentLoaded', () => {
      PackController.init();
    });
  </script>
</body>
</html>
