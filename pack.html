<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>C.I.P.H.E.R. // Field Pack</title>
  <link rel="stylesheet" href="css/cipher-style.css">
  <style>
    .inventory-nav-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 4px;
    }

    .inv-tab {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-dim);
      padding: 8px 4px;
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
    }

    .inv-tab.active {
      background-color: var(--bg-surface-raised);
      color: var(--text-bright);
      border-color: var(--border-bright);
    }

    .item-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item-card.is-part {
      border-color: var(--border-bright);
    }

    .item-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-name {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
    }

    .item-tag {
      font-size: 11px;
      padding: 2px 6px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-dim);
      font-weight: bold;
    }

    .item-tag.tag-part {
      border-color: var(--border-bright);
      color: var(--text-bright);
    }

    .item-desc {
      font-size: 14px;
      color: #d1fae5;
      line-height: 1.4;
    }

    .voucher-dock-form {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .cipher-input {
      flex: 1;
      background-color: #ffffff;
      border: 2px solid var(--border-bright);
      color: #000000;
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: bold;
      padding: 10px 12px;
      text-transform: uppercase;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Clean Single-Line Header -->
    <header class="status-header">
      <span class="brand-title">C.I.P.H.E.R. // FIELD PACK</span>
      <span class="telemetry-pill">STORAGE: SYNCED</span>
    </header>

    <main class="viewport-stage">
      
      <!-- 3-Column Spec Readout Grid -->
      <div class="hardware-spec-bar">
        <div>
          <div class="spec-item-title">MAINFRAME RAM</div>
          <div class="spec-item-val" id="spec-ram">128KB</div>
        </div>
        <div>
          <div class="spec-item-title">BUS SPEED</div>
          <div class="spec-item-val" id="spec-bus">1.77 MHz</div>
        </div>
        <div>
          <div class="spec-item-title">FLOAT VOLTAGE</div>
          <div class="spec-item-val" id="spec-voltage">12.6V</div>
        </div>
      </div>

      <!-- 4-Grid Category Tabs -->
      <div class="inventory-nav-tabs">
        <button class="inv-tab active" onclick="PackController.filterTab('ALL')">ALL</button>
        <button class="inv-tab" onclick="PackController.filterTab('TOOL')">TOOLS</button>
        <button class="inv-tab" onclick="PackController.filterTab('PART')">PARTS</button>
        <button class="inv-tab" onclick="PackController.filterTab('KEY')">SWAG</button>
      </div>

      <!-- Items List -->
      <div id="items-container" style="display: flex; flex-direction: column; gap: 8px;"></div>

      <!-- Field Voucher Redemption Dock -->
      <div class="cipher-panel" style="margin-top: auto;">
        <div class="panel-header">FIELD VOUCHER REDEMPTION DOCK</div>
        <div style="font-size: 13px; color: #a7f3d0; line-height: 1.35;">
          Enter codes stamped under physical ammo can lids or washers found in the field.
        </div>
        <div class="voucher-dock-form">
          <input type="text" id="voucher-input" class="cipher-input" placeholder="STAMPED VOUCHER..." autocomplete="off">
          <button class="btn-cipher primary" onclick="PackController.redeemVoucher()">[ CLAIM ]</button>
        </div>
      </div>

    </main>

    <!-- Symmetrical 4-Anchor Nav with Dedicated SVG Icons -->
    <nav class="nav-anchor-strip">
      <a href="mission.html" class="nav-tab">
        <svg class="ui-icon ui-icon-nav" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <span>MISSION</span>
      </a>
      <a href="map.html" class="nav-tab">
        <svg class="ui-icon ui-icon-nav" viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
        <span>MAP</span>
      </a>
      <a href="pack.html" class="nav-tab active">
        <svg class="ui-icon ui-icon-nav" viewBox="0 0 24 24"><path d="M4 10a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10z"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path></svg>
        <span>PACK</span>
      </a>
      <a href="profile.html" class="nav-tab">
        <svg class="ui-icon ui-icon-nav" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>MENU</span>
      </a>
    </nav>
  </div>

  <script src="js/cipher-audio.js"></script>
  <script src="js/cipher-core.js"></script>
  <script>
    const PackController = (function () {
      let activeFilter = 'ALL';

      return {
        init: function () {
          this.updateHardwareDisplay();
          this.renderInventory();
        },

        updateHardwareDisplay: function () {
          const state = CipherCore.getState();
          document.getElementById('spec-ram').textContent = `${state.hardware.ramKB}KB`;
          document.getElementById('spec-bus').textContent = state.hardware.busSpeed;
          document.getElementById('spec-voltage').textContent = state.hardware.floatVoltage;
        },

        filterTab: function (category) {
          CipherAudio.click();
          activeFilter = category;
          document.querySelectorAll('.inv-tab').forEach(tab => {
            tab.classList.toggle('active', tab.textContent.includes(category));
          });
          this.renderInventory();
        },

        renderInventory: function () {
          const state = CipherCore.getState();
          const container = document.getElementById('items-container');
          container.innerHTML = '';

          const filtered = state.inventory.filter(item => {
            if (activeFilter === 'ALL') return true;
            return item.type === activeFilter;
          });

          if (filtered.length === 0) {
            container.innerHTML = `
              <div class="cipher-panel" style="text-align: center; color: var(--text-dim); padding: 18px; font-size: 14px;">
                NO ASSETS IN PACK UNDER [${activeFilter}]
              </div>
            `;
            return;
          }

          filtered.forEach(item => {
            const isPart = item.type === 'PART';
            const card = document.createElement('div');
            card.className = `item-card ${isPart ? 'is-part' : ''}`;

            card.innerHTML = `
              <div class="item-header-row">
                <span class="item-name">${item.name}</span>
                <span class="item-tag ${isPart ? 'tag-part' : ''}">[${item.type}]</span>
              </div>
              <div class="item-desc">${item.desc}</div>
              <div style="display: flex; gap: 8px; margin-top: 6px;">
                ${isPart ? `<button class="btn-cipher primary" style="font-size: 13px; padding: 6px 12px;" onclick="PackController.feedItem('${item.id}')">[ ⚡ FEED TO CIPHER ]</button>` : ''}
                <button class="btn-cipher" style="font-size: 13px; padding: 6px 12px;" onclick="PackController.inspectItem('${item.name}')">[ 🔍 INSPECT ]</button>
              </div>
            `;

            container.appendChild(card);
          });
        },

        feedItem: function (itemId) {
          const result = CipherCore.feedItemToCipher(itemId);
          if (result.success) {
            this.updateHardwareDisplay();
            this.renderInventory();
          } else {
            CipherAudio.buzz();
            alert(result.reason);
          }
        },

        inspectItem: function (name) {
          CipherAudio.click();
          alert(`[INSPECTOR] // ${name}\nSerial markings verified authentic.`);
        },

        redeemVoucher: function () {
          const input = document.getElementById('voucher-input');
          const code = input.value.trim().toUpperCase();
          if (!code) return;

          if (code === "GC1-LID-ANCHOR" || code === "ANCHOR-LID-72") {
            CipherAudio.chime();
            const state = CipherCore.getState();

            if (state.inventory.some(i => i.id === 'PART_TUNING_COIL')) {
              alert("Lid voucher already claimed in pack.");
              return;
            }

            state.inventory.push({
              id: 'PART_TUNING_COIL',
              type: 'PART',
              name: 'Antenna Tuning Coil (Surplus)',
              desc: 'High-gain ferrite coil found in Cache 01. Feed to C.I.P.H.E.R. to boost RAM to 256KB.',
              consumable: true,
              targetUpgrade: 'ramKB',
              upgradeVal: 256
            });

            CipherCore.commitMilestone('VOUCHER_CLAIMED', { code: code });
            CipherAudio.speak("Lid voucher verified. Surplus hardware added to pack.");
            input.value = '';
            this.renderInventory();
          } else {
            CipherAudio.buzz();
            alert("INVALID VOUCHER CODE. Check the physical ammo can lid stamp.");
            input.value = '';
          }
        }
      };
    })();

    document.addEventListener('DOMContentLoaded', () => {
      PackController.init();
    });
  </script>
</body>
</html>
